<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"/>
<title>Alongside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A3A34; --ink-soft:#61736C; --ink-faint:#93A29B;
  --paper:#FBFAF6; --line:#E4E8E2;
  --moss:#4A7A63; --clay:#DFA089;
  --gold:#E8B94E; --rose:#E98B9B;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:#0E1A16; color:var(--ink);
  font-family:'Nunito',sans-serif;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
button{font-family:'Nunito',sans-serif;cursor:pointer;}

/* ============ VIEWPORT / WORLD ============ */
#stage{position:fixed;inset:0;overflow:hidden;}
#world{
  position:absolute;top:0;left:0;height:100%;
  background-repeat:no-repeat;background-position:center bottom;
  background-size:cover;
  will-change:transform;
}
#tod{position:absolute;inset:0;pointer-events:none;transition:background 1.4s ease;}

.critter{position:absolute;transform-origin:50% 100%;pointer-events:none;will-change:transform,left,bottom;}
.critter img{display:block;width:100%;height:auto;
  filter:drop-shadow(0 8px 7px rgba(38,58,42,.24));transition:filter .9s ease;}
.critter.low img{filter:drop-shadow(0 8px 7px rgba(38,58,42,.24)) saturate(.4) brightness(.95);}

.pop{position:absolute;pointer-events:none;font-size:20px;animation:pop 1.8s ease-out forwards;z-index:6;}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,0) scale(.4);}
  18%{opacity:1;transform:translate(-50%,-16px) scale(1.25);}
  40%{transform:translate(-50%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-70px) scale(.95);}
}
.heart-tap{position:absolute;pointer-events:none;font-size:17px;color:#E7788C;animation:pop 1.5s ease-out forwards;z-index:6;}

.butterfly{position:absolute;width:9px;height:9px;pointer-events:none;z-index:4;}
.butterfly::before,.butterfly::after{
  content:'';position:absolute;top:0;width:6px;height:9px;
  border-radius:60% 60% 50% 50%;background:currentColor;opacity:.85;}
.butterfly::before{left:-1px;transform-origin:right center;animation:fl .17s ease-in-out infinite alternate;}
.butterfly::after{right:-1px;transform-origin:left center;animation:fr .17s ease-in-out infinite alternate;}
@keyframes fl{from{transform:rotateY(0);}to{transform:rotateY(70deg);}}
@keyframes fr{from{transform:rotateY(0);}to{transform:rotateY(-70deg);}}
.zzz{position:absolute;font-family:'Fraunces',serif;font-size:14px;
  color:rgba(245,250,246,.75);font-style:italic;pointer-events:none;z-index:5;}

/* ============ HUD ============ */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(var(--safe-t) + 16px) 18px 26px;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(210,232,240,.75), rgba(210,232,240,0));
}
.hud-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.streak{
  font-family:'Fraunces',serif;font-size:26px;color:#243B33;
  text-shadow:0 1px 8px rgba(255,255,255,.6);line-height:1;
}
.streak small{font-size:13px;font-family:'Nunito',sans-serif;font-weight:700;color:#4A6357;margin-left:2px;}
.who{
  font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#4A6357;
  text-transform:uppercase;text-shadow:0 1px 6px rgba(255,255,255,.6);
}
#tokens{
  display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;max-width:78%;
  font-size:14px;line-height:1;
}
#tokens span{filter:drop-shadow(0 1px 3px rgba(255,255,255,.7));animation:tin .5s ease-out backwards;}
@keyframes tin{from{opacity:0;transform:scale(.3) translateY(-6px);}to{opacity:1;transform:none;}}

/* ============ BOTTOM PANEL ============ */
#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:44px 18px calc(var(--safe-b) + 20px);
  background:linear-gradient(180deg, rgba(126,168,120,0), rgba(104,146,100,.55) 45%, rgba(88,128,86,.8));
}
.panel-inner{max-width:440px;margin:0 auto;}
.primary{
  width:100%;border:none;border-radius:100px;background:var(--moss);color:#fff;
  font-size:15.5px;font-weight:700;padding:16px;
  box-shadow:0 12px 26px -10px rgba(28,54,42,.75);
  transition:transform .12s ease;
}
.primary:active{transform:scale(.985);}
.secondary{
  display:block;width:100%;background:none;border:none;color:rgba(255,255,255,.82);
  font-size:13px;font-weight:700;padding:14px 0 0;
  text-decoration:underline;text-underline-offset:3px;
  text-shadow:0 1px 4px rgba(0,0,0,.25);
}
.restline{text-align:center;font-size:13.5px;color:#fff;line-height:1.6;
  text-shadow:0 1px 5px rgba(0,0,0,.3);}
.restline button{background:none;border:none;color:#fff;font-weight:700;
  font-size:13.5px;text-decoration:underline;padding:0;opacity:.85;}
.whisper{
  text-align:center;font-family:'Fraunces',serif;font-style:italic;
  font-size:13px;color:rgba(255,255,255,.9);margin:0 0 14px;line-height:1.5;
  text-shadow:0 1px 6px rgba(0,0,0,.35);
}
.tapnote{
  position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 128px);z-index:9;
  text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:rgba(255,255,255,.75);pointer-events:none;transition:opacity .8s ease;
  text-shadow:0 1px 5px rgba(0,0,0,.3);
}

/* ============ ONBOARDING ============ */
#onboard{
  position:fixed;inset:0;z-index:20;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);
  overflow-y:auto;
}
#onboard.off{display:none;}
.ob{width:100%;max-width:400px;text-align:center;}
.mark{font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--moss);margin-bottom:24px;}
.ob h1{font-size:26px;line-height:1.25;}
.ob .sub{margin:12px auto 0;max-width:330px;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}
.picker{display:flex;gap:5px;justify-content:center;align-items:flex-end;margin:28px 0 4px;flex-wrap:wrap;}
.pick{border:none;background:none;padding:6px 3px;border-radius:14px;opacity:.45;filter:saturate(.45);
  transition:transform .18s ease,opacity .18s ease,filter .18s ease;}
.pick img{height:60px;display:block;}
.pick.on{opacity:1;filter:none;transform:translateY(-6px) scale(1.08);}
.picked-label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;height:15px;margin-bottom:20px;}
.nameline{border-bottom:1.5px solid var(--line);padding-bottom:9px;max-width:260px;margin:0 auto;}
.nameline input{border:none;background:none;outline:none;text-align:center;width:100%;
  font-family:'Fraunces',serif;font-size:21px;color:var(--ink);}
.nameline input::placeholder{color:#C3CCC6;}
.begin{margin-top:28px;border:none;border-radius:100px;background:var(--moss);color:#fff;
  font-size:15px;font-weight:700;padding:14px 34px;transition:opacity .2s ease;}
.begin:disabled{opacity:.28;cursor:not-allowed;}

/* ============ MODALS ============ */
.veil{position:fixed;inset:0;background:rgba(28,44,38,.55);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:40;}
.veil.on{display:flex;}
.sheet{background:var(--paper);border-radius:22px;padding:28px 24px 22px;max-width:340px;
  width:100%;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);}
.sheet h3{font-size:20px;margin-bottom:11px;}
.sheet p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0;}
.sheet .row{display:flex;gap:9px;margin-top:22px;}
.sheet .row button{flex:1;border:none;border-radius:100px;padding:13px 8px;font-size:14px;font-weight:700;}
.ghost{background:#EDF0EB;color:var(--ink-soft);}
.solid{background:var(--moss);color:#fff;}
.clay{background:var(--clay);color:#fff;}

.badge{position:fixed;top:calc(var(--safe-t) + 78px);left:50%;transform:translate(-50%,-220%);
  background:rgba(30,44,38,.94);color:#fff;padding:11px 20px;border-radius:100px;
  font-size:13px;font-weight:700;z-index:50;white-space:nowrap;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.5);}
.badge.on{transform:translate(-50%,0);}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;}}
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <div id="tod"></div>
    <div class="critter" id="critter"><img id="critterImg" src="" alt=""/></div>
  </div>
</div>

<div id="hud">
  <div class="hud-row">
    <div class="streak" id="streakBig">0<small> days</small></div>
    <div class="who" id="whoLbl"></div>
  </div>
  <div id="tokens"></div>
</div>

<div class="tapnote" id="tapnote">tap the meadow to call them over</div>

<div id="panel">
  <div class="panel-inner">
    <p class="whisper" id="whisper"></p>
    <button class="primary" id="checkBtn">Log a sober day</button>
    <button class="secondary" id="slipBtn">I had a drink today</button>
    <div class="restline" id="restline" style="display:none;">
      <span id="restText"></span> <button id="undoBtn">Undo</button>
    </div>
  </div>
</div>

<div id="onboard">
  <div class="ob">
    <div class="mark">Alongside</div>
    <h1>Someone to walk the days with.</h1>
    <p class="sub">Choose a companion. They live in the meadow, and every sober day you log, they grow into it a little more.</p>
    <div class="picker" id="picker"></div>
    <div class="picked-label" id="pickedLabel"></div>
    <div class="nameline"><input id="nameIn" maxlength="16" placeholder="name them" autocomplete="off"/></div>
    <button class="begin" id="beginBtn" disabled>Begin</button>
  </div>
</div>

<div class="veil" id="veilSlip"><div class="sheet">
  <h3>It's okay to say so.</h3>
  <p id="slipTxt"></p>
  <div class="row"><button class="ghost" id="slipNo">Not today</button><button class="clay" id="slipYes">Log it</button></div>
</div></div>

<div class="veil" id="veilAfter"><div class="sheet">
  <h3>Back to day one.</h3>
  <p id="afterTxt"></p>
  <div class="row"><button class="solid" id="afterOk">Start again</button></div>
</div></div>

<div class="badge" id="badge"></div>

  world.style.backgroundSize= W.pans ? `${W.worldW}px ${W.vh}px` : 'cover';
  clampCam();
}
function clampCam(){
  const max=Math.max(0,W.worldW-W.vw);
  W.camTarget=Math.min(max,Math.max(0,W.camTarget));
  W.camX=Math.min(max,Math.max(0,W.camX));
}
window.addEventListener('resize',()=>{layout();});

/* ---------- picker ---------- */
const picker=document.getElementById('picker');
Object.entries(A).forEach(([k,v])=>{
  const b=document.createElement('button');b.className='pick';b.type='button';
  b.innerHTML=`<img src="${v.s}" alt="${v.n}">`;
  b.onclick=()=>{
    document.querySelectorAll('.pick').forEach(e=>e.classList.remove('on'));
    b.classList.add('on');S.key=k;
    document.getElementById('pickedLabel').textContent=v.n;
    document.getElementById('beginBtn').disabled=false;
  };
  picker.appendChild(b);
});
document.getElementById('beginBtn').onclick=()=>{
  S.name=document.getElementById('nameIn').value.trim()||A[S.key].n;
  document.getElementById('onboard').classList.add('off');
  document.getElementById('critterImg').src=A[S.key].s;
  layout(); startLife(); render();
};

/* ---------- sky tint ---------- */
function tint(){
  const h=new Date().getHours(),t=document.getElementById('tod');
  if(h<6||h>=20) t.style.background='linear-gradient(180deg, rgba(28,40,84,.6), rgba(22,38,62,.4))';
  else if(h<8)   t.style.background='linear-gradient(180deg, rgba(255,176,118,.28), rgba(255,214,170,.1))';
  else if(h<17)  t.style.background='transparent';
  else           t.style.background='linear-gradient(180deg, rgba(255,164,108,.24), rgba(255,190,140,.09))';
}

/* ---------- ambience ---------- */
function ambience(){
  document.querySelectorAll('.butterfly,.zzz').forEach(e=>e.remove());
  const world=document.getElementById('world');
  const n=S.best>=28?3:S.best>=14?2:S.best>=5?1:0;
  const cols=['#F0B7C4','#F6D98A','#BFD9F2'];
  for(let i=0;i<n;i++){
    const b=document.createElement('div');b.className='butterfly';b.style.color=cols[i%3];
    world.appendChild(b);flutter(b,i);
  }
  const h=new Date().getHours();
  if(h<6||h>=21){const z=document.createElement('div');z.className='zzz';world.appendChild(z);zdrift(z);}
}
function flutter(el,i){
  const go=()=>{
    el.style.transition='left 3.6s ease-in-out, top 3.6s ease-in-out';
    el.style.left=(8+Math.random()*80)+'%';
    el.style.top=(34+Math.random()*38)+'%';
    setTimeout(go,3400+Math.random()*2400);
  };
  el.style.left=(18+i*24)+'%';el.style.top=(42+i*7)+'%';
  setTimeout(go,400+i*650);
}
function zdrift(z){
  const c=document.getElementById('critter');
  const tick=()=>{
    z.textContent='z z';
    z.style.left=(parseFloat(c.style.left||0)+c.offsetWidth*0.42)+'px';
    z.style.bottom=(parseFloat(c.style.bottom||0)+c.offsetHeight*0.92)+'px';
    if(document.body.contains(z)) requestAnimationFrame(tick);
  };
  tick();
}

/* ---------- critter life ---------- */
let L={x:0,y:0,tx:0,ty:0,face:1,moving:false};
function groundBand(){ return {lo:W.vh*0.06, hi:W.vh*0.26}; }
function critterW(){
  const g=S.best>=90?1.24:S.best>=28?1.10:S.best>=7?0.97:0.86;
  return Math.min(W.vw*0.42, W.vh*0.26) * g;
}
function depthScale(){
  const b=groundBand();
  const t=(L.y-b.lo)/Math.max(1,(b.hi-b.lo));
  return 1-t*0.22;
}
function place(){
  const c=document.getElementById('critter');
  c.style.width=critterW()+'px';
  c.style.left=L.x+'px';
  c.style.bottom=L.y+'px';
  const t=Date.now();
  const bob=L.moving?Math.abs(Math.sin(t/145))*3.2:Math.abs(Math.sin(t/640))*1.4;
  const tilt=L.moving?Math.sin(t/145)*2.6:0;
  c.style.transform=`translateX(-50%) scale(${depthScale()}) scaleX(${L.face}) translateY(${-bob}px) rotate(${tilt}deg)`;
}
function step(){
  if(!document.hidden){
    const dx=L.tx-L.x, dy=L.ty-L.y, d=Math.hypot(dx,dy);
    if(d>2){
      L.moving=true;
      const sp=Math.max(0.9, W.vw*0.0022);
      L.x+=dx/d*sp; L.y+=dy/d*sp*0.55;
      if(Math.abs(dx)>3) L.face=dx>0?-1:1;
    } else L.moving=false;

    // camera follows with dead-zone
    if(W.pans){
      const margin=W.vw*0.3;
      const screenX=L.x-W.camX;
      if(screenX<margin) W.camTarget=L.x-margin;
      else if(screenX>W.vw-margin) W.camTarget=L.x-(W.vw-margin);
      clampCam();
      W.camX+=(W.camTarget-W.camX)*0.06;
    } else W.camX=0;

    document.getElementById('world').style.transform=`translateX(${-W.camX}px)`;
    place();
  }
  requestAnimationFrame(step);
}
function pickTarget(){
  const b=groundBand();
  L.tx=W.worldW*0.08+Math.random()*W.worldW*0.84;
  L.ty=b.lo+Math.random()*(b.hi-b.lo);
  setTimeout(pickTarget,4500+Math.random()*5000);
}
function startLife(){
  const b=groundBand();
  L.x=W.worldW/2; L.y=(b.lo+b.hi)/2; L.tx=L.x; L.ty=L.y;
  W.camX=W.camTarget=Math.max(0,Math.min(W.worldW-W.vw, L.x-W.vw/2));
  tint(); ambience(); step(); setTimeout(pickTarget,1500);
  setInterval(tint,60000);
}

/* ---------- tap ---------- */
document.getElementById('stage').addEventListener('pointerdown',e=>{
  const worldX=e.clientX+W.camX;
  const h=document.createElement('div');h.className='heart-tap';h.textContent='♡';
  h.style.left=worldX+'px';
  h.style.bottom=(W.vh-e.clientY)+'px';
  document.getElementById('world').appendChild(h);
  setTimeout(()=>h.remove(),1600);
  const b=groundBand();
  L.tx=Math.max(W.worldW*0.05,Math.min(W.worldW*0.95,worldX));
  L.ty=Math.max(b.lo,Math.min(b.hi,W.vh-e.clientY));
  document.getElementById('tapnote').style.opacity='0';
});

/* ---------- tokens: hearts d1-7, star each week after ---------- */
function tokenList(){
  const hearts=Math.min(S.streak,7);
  const stars=S.streak>=14?Math.floor(S.streak/7)-1:0;
  return {hearts,stars};
}
function renderTokens(){
  const {hearts,stars}=tokenList();
  const box=document.getElementById('tokens');
  box.innerHTML='';
  for(let i=0;i<hearts;i++){
    const s=document.createElement('span');s.textContent='♥';
    s.style.color='var(--rose)';s.style.animationDelay=(i*40)+'ms';box.appendChild(s);
  }
  for(let i=0;i<stars;i++){
    const s=document.createElement('span');s.textContent='★';
    s.style.color='var(--gold)';s.style.animationDelay=((hearts+i)*40)+'ms';box.appendChild(s);
  }
}
function newTokenThisDay(n){
  if(n>=1&&n<=7) return {sym:'♥',msg:`Day ${n} — a heart for ${S.name}`};
  if(n>7&&n%7===0) return {sym:'★',msg:`Week ${n/7} — a star for ${S.name}`};
  return null;
}
function popAbove(sym){
  const c=document.getElementById('critter');
  const p=document.createElement('div');p.className='pop';p.textContent=sym;
  p.style.left=L.x+'px';
  p.style.bottom=(L.y+c.offsetHeight*0.95)+'px';
  document.getElementById('world').appendChild(p);
  setTimeout(()=>p.remove(),1900);
}

/* ---------- render ---------- */
function render(){
  document.getElementById('streakBig').innerHTML=
    S.streak===0 ? `0<small> days</small>` : `${S.streak}<small> ${S.streak===1?'day':'days'}</small>`;
  document.getElementById('whoLbl').textContent=S.name.toUpperCase();
  renderTokens();
  const done=S.last===today();
  document.getElementById('checkBtn').style.display=done?'none':'block';
  document.getElementById('slipBtn').style.display=done?'none':'block';
  document.getElementById('restline').style.display=done?'block':'none';
  document.getElementById('critter').classList.toggle('low',S.streak===0&&S.best>0);
}

document.getElementById('checkBtn').onclick=()=>{
  if(S.last===today())return;
  S.streak++;S.best=Math.max(S.best,S.streak);S.last=today();
  document.getElementById('restText').textContent=`${S.name} is settled in for the night.`;
  document.getElementById('whisper').textContent=WHISPERS[Math.floor(Math.random()*WHISPERS.length)];
  const tk=newTokenThisDay(S.streak);
  if(tk&&!S.seen.has(S.streak)){S.seen.add(S.streak);popAbove(tk.sym);toast(tk.msg);}
  ambience();
  const b=groundBand(); L.ty=Math.min(b.hi,L.ty+W.vh*0.05);
  render();
};
document.getElementById('undoBtn').onclick=()=>{S.last=null;render();};

document.getElementById('slipBtn').onclick=()=>{
  document.getElementById('slipTxt').textContent=
    `Telling ${S.name} the truth is part of this. The day count starts over, but ${S.name} stays exactly as they are — nothing you've built gets taken away.`;
  document.getElementById('veilSlip').classList.add('on');
};
document.getElementById('slipNo').onclick=()=>document.getElementById('veilSlip').classList.remove('on');
document.getElementById('slipYes').onclick=()=>{
  document.getElementById('veilSlip').classList.remove('on');
  S.streak=0;S.last=today();
  document.getElementById('restText').textContent=`${S.name} is waiting with you.`;
  document.getElementById('afterTxt').textContent=
    `${S.name} hasn't gone anywhere, and the meadow is the same size it was yesterday. Recovery bends. Beginning again is still the way forward.`;
  document.getElementById('whisper').textContent='Tomorrow is a day you can log.';
  document.getElementById('veilAfter').classList.add('on');
  render();
};
document.getElementById('afterOk').onclick=()=>document.getElementById('veilAfter').classList.remove('on');

let bt;
function toast(t){
  const b=document.getElementById('badge');b.textContent=t;b.classList.add('on');
  clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),3200);
}

layout();
</script>
</body>
</html>
