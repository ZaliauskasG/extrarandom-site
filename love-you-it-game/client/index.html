<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>We Love You, I.T. — Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#0B0F17;}
body{font-family:'Nunito',sans-serif;color:#E8EEF5;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0B0F17;}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:stretch;
  justify-content:flex-start;text-align:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:radial-gradient(ellipse at 50% 40%, rgba(24,38,64,.96), rgba(8,12,20,.99));}
.screen.off{display:none;}
.inner{margin:auto;display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px;}
h1{font-family:'Bungee',cursive;font-size:clamp(22px,6.6vw,38px);line-height:1;color:#FFD84D;text-shadow:0 4px 0 #C4841B;}
h1 span{display:block;font-size:.34em;color:#8FB6D9;text-shadow:none;letter-spacing:.2em;margin-top:8px;}
.note{font-family:'Roboto Mono',monospace;font-size:10.5px;color:#7E9AB4;line-height:1.7;margin-top:12px;}
.seclabel{font-family:'Roboto Mono',monospace;font-size:9px;letter-spacing:.24em;color:#5D7593;margin:16px 0 8px;}
.chars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.ch{background:rgba(30,48,74,.45);border:2px solid rgba(143,182,217,.16);border-radius:10px;
  padding:6px 4px 4px;cursor:pointer;width:74px;transition:border-color .14s,background .14s,transform .1s;}
.ch img{width:100%;height:50px;object-fit:contain;display:block;}
.ch span{display:block;font-family:'Roboto Mono',monospace;font-size:9px;color:#9FB8D4;margin-top:3px;}
.ch .tm{font-size:8px;letter-spacing:.08em;margin-top:1px;}
.ch.it .tm{color:#5CC8FF;} .ch.emp .tm{color:#FF8A5A;}
.ch:hover{border-color:rgba(255,216,77,.5);}
.ch.on{border-color:#FFD84D;background:rgba(58,84,120,.9);transform:translateY(-3px);}
.ch.on span{color:#FFD84D;}
.ch.taken{opacity:.3;cursor:not-allowed;}
.cta{margin-top:18px;border:none;border-radius:8px;background:#FFD84D;color:#221A00;font-family:'Bungee',cursive;
  font-size:15px;padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 #C4841B;}
.cta:disabled{opacity:.35;box-shadow:none;cursor:not-allowed;}
.cta.ready{background:#5CE08A;box-shadow:0 5px 0 #2E9B57;}
#lobbyList{font-family:'Roboto Mono',monospace;font-size:11px;color:#9FB8D4;margin-top:14px;line-height:1.9;}
#lobbyList b{color:#5CC8FF;} #lobbyList i{color:#FF8A5A;font-style:normal;}
#connNote{font-family:'Roboto Mono',monospace;font-size:10.5px;color:#7E9AB4;margin-top:10px;min-height:14px;}
#connNote.err{color:#FF6B5A;}

/* ---------- hud ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.floorname{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.18em;color:#9FB8D4;
  text-shadow:0 1px 4px rgba(0,0,0,.9);}
.whoami{font-family:'Bungee',cursive;font-size:14px;color:#FFD84D;text-shadow:0 2px 5px rgba(0,0,0,.8);}
.roster{font-family:'Roboto Mono',monospace;font-size:9.5px;color:#B9CDE4;text-align:right;
  text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.7;}
.roster .off{opacity:.45;}
#stick{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:118px;height:118px;border-radius:50%;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.13);pointer-events:auto;
  touch-action:none;display:none;}
#stick .nub{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:rgba(255,216,77,.55);border:2px solid rgba(255,216,77,.8);}
#leaveBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 28px);pointer-events:auto;
  background:rgba(30,48,74,.8);border:1px solid rgba(143,182,217,.3);border-radius:8px;
  color:#9FB8D4;font-family:'Roboto Mono',monospace;font-size:11px;padding:10px 14px;cursor:pointer;}
</style>
</head>
<body>

<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="topbar">
    <div>
      <div class="whoami" id="whoami"></div>
      <div class="floorname" id="floorname"></div>
    </div>
    <div class="roster" id="roster"></div>
  </div>
  <div id="stick"><div class="nub" id="nub"></div></div>
  <button id="leaveBtn">LOBBY</button>
</div>

<div class="screen" id="lobby">
  <div class="inner">
    <h1>We Love You, I.T.<span>MULTIPLAYER — MILESTONE 1</span></h1>
    <p class="note">Pick a character to join the office.<br>
       Ryan &amp; Juan are I.T. Gin joins I.T. once there are 6 players.</p>
    <div class="seclabel">PICK YOUR CHARACTER</div>
    <div class="chars" id="charPick"></div>
    <div id="lobbyList"></div>
    <button class="cta" id="readyBtn" disabled>Ready</button>
    <div id="connNote">connecting…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@colyseus/sdk@0.17.43/dist/colyseus.js"></script>

var IMGS = {};
for (var k in FACES) { var im = new Image(); im.src = "data:image/webp;base64," + FACES[k]; IMGS[k] = im; }

var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var noteEl = document.getElementById("connNote");
var lobbyEl = document.getElementById("lobby");

var MAP = null, room = null, myId = null;
var TILE = 22, GW = 64, GH = 50;
var VW = 0, VH = 0, DPR = 1;
var cam = { x: 0, y: 0 };
var renderPos = {};        // sessionId -> smoothed {x,y}
var lastT = null;
var SMOOTH = 20;

function setNote(msg, isErr) { noteEl.textContent = msg; noteEl.className = isErr ? "err" : ""; }
window.addEventListener("error", function (e) { setNote("Error: " + e.message, true); });
window.addEventListener("unhandledrejection", function (e) {
  setNote("Error: " + ((e.reason && e.reason.message) || e.reason), true);
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.style.width = VW + "px"; cv.style.height = VH + "px";
  cv.width = VW * DPR; cv.height = VH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  document.getElementById("stick").style.display = touch ? "block" : "none";
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
resize();

/* ---------------- map ---------------- */
fetch(httpBase() + "/mapdata").then(function (r) { return r.json(); }).then(function (d) {
  MAP = d; TILE = d.TILE; GW = d.GW; GH = d.GH;
  buildCharPicker();
  connect();
}).catch(function (e) { setNote("Could not load map: " + e.message, true); });

/* ---------------- lobby ui ---------------- */
var myChar = null;
function buildCharPicker() {
  var box = document.getElementById("charPick");
  box.innerHTML = "";
  MAP.characters.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "ch";
    d.dataset.id = c.id;
    var teamLabel = c.team === "it" ? "I.T." : c.team === "emp" ? "EMPLOYEE" : "FLEX";
    d.innerHTML = '<img src="data:image/webp;base64,' + FACES[c.id] + '" alt="' + c.name + '">' +
                  "<span>" + c.name.toUpperCase() + '</span><span class="tm">' + teamLabel + "</span>";
    d.addEventListener("click", function () {
      if (d.classList.contains("taken")) return;
      myChar = c.id;
      if (room) room.send("pick", c.id);
      refreshPicker();
    });
    box.appendChild(d);
  });
}
function refreshPicker() {
  var taken = {};
  if (room && room.state && room.state.players) {
    room.state.players.forEach(function (p, id) {
      if (p.charId && id !== myId) taken[p.charId] = true;
    });
  }
  document.querySelectorAll(".ch").forEach(function (d) {
    var id = d.dataset.id;
    d.classList.toggle("taken", !!taken[id]);
    d.classList.toggle("on", id === myChar);
    var c = MAP.characters.find(function (c) { return c.id === id; });
    var lbl = d.querySelector(".tm");
    if (c && c.team === "flex") {
      var n = countActive();
      lbl.textContent = n >= 6 ? "I.T." : "EMPLOYEE";
      d.classList.remove("it", "emp");
      d.classList.add(n >= 6 ? "it" : "emp");
    } else if (c) {
      d.classList.add(c.team === "it" ? "it" : "emp");
    }
  });
  document.getElementById("readyBtn").disabled = !myChar;
}
function countActive() {
  var n = 0;
  if (room && room.state && room.state.players)
    room.state.players.forEach(function (p) { if (p.charId && !p.spectator) n++; });
  return n;
}
function refreshLobbyList() {
  if (!room || !room.state || !room.state.players) return;
  var it = [], emp = [], spec = [];
  room.state.players.forEach(function (p, id) {
    if (!p.charId) return;
    var tag = p.name + (id === myId ? " (you)" : "") + (p.ready ? " ✓" : "") + (p.connected ? "" : " (idle)");
    if (p.spectator) spec.push(tag);
    else if (p.team === "it") it.push(tag);
    else emp.push(tag);
  });
  var html = "<b>I.T.:</b> " + (it.join(", ") || "—") + "<br>" +
             "<i>Employees:</i> " + (emp.join(", ") || "—");
  if (spec.length) html += "<br>watching: " + spec.join(", ");
  document.getElementById("lobbyList").innerHTML = html;
}

document.getElementById("readyBtn").addEventListener("click", function () {
  if (!room || !myChar) return;
  var p = room.state.players.get(myId);
  var next = !(p && p.ready);
  room.send("ready", next);
  this.textContent = next ? "Ready ✓" : "Ready";
  this.classList.toggle("ready", next);
  // milestone 1 has no round yet -- readying just drops you into the world
  lobbyEl.classList.add("off");
});
document.getElementById("leaveBtn").addEventListener("click", function () {
  lobbyEl.classList.remove("off");
});

/* ---------------- connect ---------------- */
function connect() {
  var client = new Colyseus.Client(endpoint());
  var tries = 0;

  function attempt() {
    tries++;
    // reconnect straight back into our character if we have a token
    var token = null;
    try { token = sessionStorage.getItem("wlyitToken"); } catch (e) {}
    var p = token ? client.reconnect(token).catch(function () { return client.joinOrCreate("wlyit"); })
                  : client.joinOrCreate("wlyit");

    p.then(function (r) {
      room = r; myId = r.sessionId;
      try { sessionStorage.setItem("wlyitToken", r.reconnectionToken); } catch (e) {}
      setNote("connected");

      var $ = Colyseus.getStateCallbacks(r);
      $(r.state).players.onAdd(function (pl, id) {
        renderPos[id] = { x: pl.x, y: pl.y };
        refreshPicker(); refreshLobbyList();
        $(pl).listen("charId", function () { refreshPicker(); refreshLobbyList(); });
        $(pl).listen("ready", refreshLobbyList);
        $(pl).listen("team", refreshLobbyList);
        $(pl).listen("connected", refreshLobbyList);
      });
      $(r.state).players.onRemove(function (pl, id) {
        delete renderPos[id]; refreshPicker(); refreshLobbyList();
      });

      r.onLeave(function (code) {
        setNote("disconnected — reload to rejoin", true);
        lobbyEl.classList.remove("off");
      });
    }).catch(function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      if (err && (err.code === 520 || err.name === "MatchMakeError")) {
        setNote("Server has no “wlyit” room — is it running an older deploy?", true);
        return;
      }
      if (tries < 6) { setNote("Waking the server… (" + tries + "/6)"); setTimeout(attempt, 5000); return; }
      setNote("Could not connect: " + msg, true);
    });
  }
  attempt();
}

/* ---------------- input ---------------- */
var keys = {};
window.addEventListener("keydown", function (e) {
  var k = e.key.toLowerCase(); keys[k] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k) >= 0) e.preventDefault();
});
window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

var stickVec = { x: 0, y: 0 }, stickId = null;
var stickEl = document.getElementById("stick"), nubEl = document.getElementById("nub");
function moveStick(e) {
  var r = stickEl.getBoundingClientRect();
  var dx = (e.clientX - r.left - r.width / 2) / (r.width / 2);
  var dy = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  var m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
  stickVec = { x: dx, y: dy };
  nubEl.style.transform = "translate(" + dx * 34 + "px," + dy * 34 + "px)";
}
stickEl.addEventListener("pointerdown", function (e) { stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId); moveStick(e); });
stickEl.addEventListener("pointermove", function (e) { if (e.pointerId === stickId) moveStick(e); });
function endStick() { stickId = null; stickVec = { x: 0, y: 0 }; nubEl.style.transform = ""; }
stickEl.addEventListener("pointerup", endStick);
stickEl.addEventListener("pointercancel", endStick);

var lastSent = { x: 0, y: 0 };
setInterval(function () {
  if (!room) return;
  var x = 0, y = 0;
  if (keys["w"] || keys["arrowup"]) y -= 1;
  if (keys["s"] || keys["arrowdown"]) y += 1;
  if (keys["a"] || keys["arrowleft"]) x -= 1;
  if (keys["d"] || keys["arrowright"]) x += 1;
  x += stickVec.x; y += stickVec.y;
  x = Math.max(-1, Math.min(1, x)); y = Math.max(-1, Math.min(1, y));
  if (x !== lastSent.x || y !== lastSent.y) {
    room.send("move", { x: x, y: y });
    lastSent = { x: x, y: y };
  }
}, 1000 / 30);

/* ---------------- drawing ---------------- */
function me() {
  if (!room || !room.state || !room.state.players) return null;
  return room.state.players.get(myId) || null;
}
function drawLevel(lvl) {
  var L = MAP.levels[lvl]; if (!L) return;
  var g = L.grid;
  var x0 = Math.max(0, Math.floor(cam.x / TILE) - 1), x1 = Math.min(GW, Math.ceil((cam.x + VW) / TILE) + 1);
  var y0 = Math.max(0, Math.floor(cam.y / TILE) - 1), y1 = Math.min(GH, Math.ceil((cam.y + VH) / TILE) + 1);
  var floor = lvl === "EXT" ? "#31432F" : (lvl === "DN" ? "#34445F" : "#32425C");
  var wall  = lvl === "EXT" ? "#3E3527" : (lvl === "DN" ? "#161F32" : "#151D2F");
  for (var j = y0; j < y1; j++) for (var i = x0; i < x1; i++) {
    ctx.fillStyle = g[j][i] === 0 ? floor : wall;
    ctx.fillRect(i * TILE, j * TILE, TILE, TILE);
    if (g[j][i] === 0 && (i + j) % 2 === 0) {
      ctx.fillStyle = "rgba(255,255,255,.028)";
      ctx.fillRect(i * TILE, j * TILE, TILE, TILE);
    }
  }
  // top edge on walls, for a little depth
  ctx.fillStyle = "rgba(255,255,255,.07)";
  for (var j2 = y0; j2 < y1; j2++) for (var i2 = x0; i2 < x1; i2++)
    if (g[j2][i2] === 1 && j2 + 1 < GH && g[j2 + 1][i2] === 0)
      ctx.fillRect(i2 * TILE, (j2 + 1) * TILE - 3, TILE, 3);

  (MAP.labels[lvl] || []).forEach(function (l) {
    ctx.fillStyle = "rgba(255,255,255,.17)";
    ctx.font = "700 " + Math.max(9, TILE * 0.42) + "px Nunito, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(l[0], (l[1] + 0.5) * TILE, (l[2] + 0.5) * TILE);
  });

  MAP.transitions.forEach(function (t) {
    if (t.level !== lvl) return;
    var bx = (t.x - 1) * TILE, by = (t.y - 1) * TILE, bw = TILE * 3;
    ctx.fillStyle = t.kind === "stair" ? "#3E4E6B" : "#5A4A32";
    ctx.fillRect(bx, by, bw, bw);
    ctx.strokeStyle = t.kind === "stair" ? "#8FB6D9" : "#D9C08A";
    ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, bw - 2);
    ctx.fillStyle = "#DCEAF8";
    ctx.font = "700 " + Math.max(8, TILE * 0.34) + "px 'Roboto Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText(t.label, (t.x + 0.5) * TILE, by - 6);
  });
}
function drawPlayer(p, id) {
  var r = renderPos[id] || { x: p.x, y: p.y };
  var x = r.x * TILE, y = r.y * TILE;
  var im = IMGS[p.charId];
  var h = TILE * 2.25, w = (im && im.naturalWidth) ? h * (im.naturalWidth / im.naturalHeight) : h * 0.6;

  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = p.connected ? 1 : 0.45;      // idle bodies fade
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.beginPath(); ctx.ellipse(0, TILE * 0.44, w * 0.34, TILE * 0.16, 0, 0, 6.28); ctx.fill();
  if (im && im.complete && im.naturalWidth) {
    ctx.save(); ctx.scale(p.facing < 0 ? -1 : 1, 1);
    ctx.drawImage(im, -w / 2, -h + TILE * 0.5, w, h);
    ctx.restore();
  }
  ctx.globalAlpha = p.connected ? 0.8 : 0.35;
  ctx.strokeStyle = (id === myId) ? "#FFD84D" : (p.team === "it" ? "#4E86AE" : "#B4694A");
  ctx.lineWidth = id === myId ? 2 : 1.5;
  ctx.beginPath(); ctx.ellipse(0, TILE * 0.44, w * 0.30, TILE * 0.13, 0, 0, 6.28); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = (id === myId) ? "#FFD84D" : "rgba(255,255,255,.8)";
  ctx.font = "700 " + Math.max(9, TILE * 0.4) + "px Nunito, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(p.name + (p.connected ? "" : " (idle)"), 0, -h + TILE * 0.5 - 6);
  ctx.restore();
}
function draw() {
  ctx.fillStyle = "#0B0F17"; ctx.fillRect(0, 0, VW, VH);
  if (!MAP) return;
  var p = me(); if (!p) return;
  var r = renderPos[myId] || { x: p.x, y: p.y };

  var tx = r.x * TILE - VW / 2, ty = r.y * TILE - VH / 2;
  cam.x += (tx - cam.x) * 0.2; cam.y += (ty - cam.y) * 0.2;
  cam.x = Math.max(-40, Math.min(GW * TILE - VW + 40, cam.x));
  cam.y = Math.max(-40, Math.min(GH * TILE - VH + 40, cam.y));

  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawLevel(p.level);
  room.state.players.forEach(function (q, id) {
    if (q.level !== p.level || !q.charId) return;
    drawPlayer(q, id);
  });
  ctx.restore();

  document.getElementById("whoami").textContent = p.name || "";
  document.getElementById("floorname").textContent =
    (MAP.levels[p.level] ? MAP.levels[p.level].name : "") + (p.spectator ? " · SPECTATING" : "");

  var lines = [];
  room.state.players.forEach(function (q, id) {
    if (!q.charId) return;
    lines.push('<div class="' + (q.connected ? "" : "off") + '">' +
      q.name + (q.team === "it" ? " · IT" : q.team === "emp" ? " · EMP" : "") +
      (q.spectator ? " · watching" : "") + "</div>");
  });
  document.getElementById("roster").innerHTML = lines.join("");
}

/* ---------------- loop ----------------
   next frame scheduled FIRST so one bad frame can't kill rendering  */
function frame(now) {
  requestAnimationFrame(frame);
  var dt = lastT === null ? 1 / 60 : Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  try {
    if (room && room.state && room.state.players) {
      var k = 1 - Math.exp(-SMOOTH * dt);
      room.state.players.forEach(function (p, id) {
        var r = renderPos[id];
        if (!r) { r = renderPos[id] = { x: p.x, y: p.y }; return; }
        // snap rather than slide when someone changes floor
        if (Math.hypot(p.x - r.x, p.y - r.y) > 6) { r.x = p.x; r.y = p.y; }
        else { r.x += (p.x - r.x) * k; r.y += (p.y - r.y) * k; }
      });
    }
    draw();
  } catch (err) {
    console.error("render error (loop continues):", err);
  }
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
