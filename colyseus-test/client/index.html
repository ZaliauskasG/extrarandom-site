<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Colyseus Hello World — Two Dots</title>
<style>
  body{margin:0;background:#0b0f17;color:#dce8f5;font-family:sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{font-size:18px;margin:0 0 4px;}
  p{font-size:13px;color:#8fa8c2;margin:0 0 14px;}
  canvas{background:#131b2b;border:2px solid #2c3a54;border-radius:8px;}
  #status{margin-top:10px;font-family:monospace;font-size:12px;color:#5cc8ff;}
  #roster{margin-top:8px;font-family:monospace;font-size:11px;color:#8fa8c2;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px;}
  #roster span{display:flex;align-items:center;gap:5px;}
  #roster i{width:9px;height:9px;border-radius:50%;display:block;}
</style>
</head>
<body>
<h1>Colyseus Hello World</h1>
<p>WASD or arrow keys to move. Open more tabs (up to 8) to add more dots.</p>
<canvas id="cv" width="720" height="480"></canvas>
<div id="status">connecting…</div>
<div id="roster"></div>

<!-- Browser build of the client SDK — exposes a global `Colyseus` object.
     Version must match the server's colyseus/@colyseus/core version line. -->
<script src="https://cdn.jsdelivr.net/npm/@colyseus/sdk@0.17.43/dist/colyseus.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');

// ---- where's the server? ------------------------------------------
// If this page was served BY the Colyseus server, connect back to
// wherever it came from (works on localhost and once deployed).
// If you opened this file directly, or host it somewhere static like
// GitHub Pages, set SERVER_URL below to your deployed server instead.
const SERVER_URL = "wss://extrarandom-site.onrender.com"; // e.g. "wss://my-game.up.railway.app"

function endpoint() {
  if (SERVER_URL) return SERVER_URL;
  if (location.protocol === "http:" || location.protocol === "https:") {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    return `${proto}://${location.host}`;
  }
  return "ws://localhost:2567"; // opened straight from disk
}

const client = new Colyseus.Client(endpoint());

let room = null;
let mySessionId = null;

async function main() {
  try {
    room = await client.joinOrCreate('dots');
    mySessionId = room.sessionId;
    statusEl.textContent = 'connected';

    // Every time the server's authoritative state changes, redraw.
    // This is the whole multiplayer trick: the client never decides
    // where anyone is, it only ever draws what the server just said.
    room.onStateChange(() => { draw(); drawRoster(); });

    room.onLeave(() => { statusEl.textContent = 'disconnected'; });
  } catch (e) {
    statusEl.textContent = 'could not connect — is the server running?';
    console.error(e);
  }
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.strokeRect(1, 1, cv.width - 2, cv.height - 2);

  room.state.players.forEach((player, sessionId) => {
    const isMe = sessionId === mySessionId;

    ctx.beginPath();
    ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    if (isMe) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }

    // Names matter once there are more than two dots on screen.
    ctx.fillStyle = isMe ? '#fff' : 'rgba(220,232,245,.7)';
    ctx.font = (isMe ? 'bold ' : '') + '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(player.name, player.x, player.y - 20);
  });
}

function drawRoster() {
  const box = document.getElementById('roster');
  let html = '';
  room.state.players.forEach((player, sessionId) => {
    const me = sessionId === mySessionId ? ' (you)' : '';
    html += `<span><i style="background:${player.color}"></i>${player.name}${me}</span>`;
  });
  box.innerHTML = html;
  statusEl.textContent = `connected — ${room.state.players.size}/8 players`;
}

// ---- input: send an intent, never a position -----------------------
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

setInterval(() => {
  if (!room) return;
  let x = 0, y = 0;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  room.send('move', { x, y });
}, 1000 / 30);

main();
</script>
</body>
</html>
