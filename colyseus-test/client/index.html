<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Colyseus Hello World — Up To 8 Dots</title>
<style>
  *{-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#0b0f17;color:#dce8f5;font-family:sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px;
    touch-action:manipulation;}
  h1{font-size:17px;margin:0 0 4px;text-align:center;}
  p{font-size:12.5px;color:#8fa8c2;margin:0 0 12px;text-align:center;max-width:520px;}
  canvas{background:#131b2b;border:2px solid #2c3a54;border-radius:8px;
    width:100%;max-width:720px;height:auto;touch-action:none;display:block;}
  #status{margin-top:10px;font-family:monospace;font-size:12px;color:#5cc8ff;}
  #roster{margin-top:8px;font-family:monospace;font-size:11px;color:#8fa8c2;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px;}
  #roster span{display:flex;align-items:center;gap:5px;}
  #roster i{width:9px;height:9px;border-radius:50%;display:block;}
</style>
</head>
<body>
<h1>Colyseus Hello World</h1>
<p>Tap or click anywhere to walk there. On a keyboard, WASD / arrow keys also work.<br>Open more tabs (up to 8) to add more dots.</p>
<canvas id="cv" width="720" height="480"></canvas>
<div id="status">connecting…</div>
<div id="roster"></div>

<!-- Browser build of the client SDK — exposes a global `Colyseus` object.
     Version must match the server's colyseus/@colyseus/core version line. -->
<script src="https://cdn.jsdelivr.net/npm/@colyseus/sdk@0.17.43/dist/colyseus.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');

// ---- where's the server? ------------------------------------------
// If this page was served BY the Colyseus server, connect back to
// wherever it came from (works on localhost and once deployed).
// If you opened this file directly, or host it somewhere static like
// GitHub Pages, set SERVER_URL below to your deployed server instead.
const SERVER_URL = ""; // e.g. "wss://my-game.up.railway.app"

function endpoint() {
  if (SERVER_URL) return SERVER_URL;
  if (location.protocol === "http:" || location.protocol === "https:") {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    return `${proto}://${location.host}`;
  }
  return "ws://localhost:2567"; // opened straight from disk
}

const { Client, getStateCallbacks } = Colyseus;
const client = new Client(endpoint());

let room = null;
let mySessionId = null;

// ---- smoothing / interpolation ---------------------------------------
// The server only tells us a position ~30x/sec, and on a loaded free
// host those updates can arrive a little irregularly. Rather than snap
// the dot straight to each new number (which looks jittery), each dot
// eases toward wherever the server currently says it is. This runs every
// screen refresh (60fps+), independent of how often the network update
// actually arrives -- so motion stays smooth even if a tick is late.
const renderPos = new Map(); // sessionId -> {x, y} -- what we actually draw
const SMOOTH_RATE = 24;      // higher = snappier & less smoothing
let lastFrameTime = null;

function smoothStep(current, target, dt) {
  const k = 1 - Math.exp(-SMOOTH_RATE * dt);
  return current + (target - current) * k;
}

function animate(now) {
  const dt = lastFrameTime === null ? 1 / 60 : Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  if (room) {
    room.state.players.forEach((player, sessionId) => {
      let r = renderPos.get(sessionId);
      if (!r) { r = { x: player.x, y: player.y }; renderPos.set(sessionId, r); }
      r.x = smoothStep(r.x, player.x, dt);
      r.y = smoothStep(r.y, player.y, dt);
    });
    draw();
  }
  requestAnimationFrame(animate);
}

async function main() {
  try {
    room = await client.joinOrCreate('dots');
    mySessionId = room.sessionId;
    statusEl.textContent = 'connected';

    // Roster only needs to change when someone actually joins or leaves --
    // wiring it to onAdd/onRemove instead of "every state change" stops it
    // rebuilding the whole player list ~20-30x/sec while people just move.
    const $ = getStateCallbacks(room);
    $(room.state).players.onAdd((player, sessionId) => {
      renderPos.set(sessionId, { x: player.x, y: player.y }); // no slide-in from (0,0)
      drawRoster();
      // "it" changing is rare, so listening for it is still far cheaper
      // than rebuilding the roster on every position tick
      $(player).listen("isIt", () => drawRoster());
    });
    $(room.state).players.onRemove((player, sessionId) => {
      renderPos.delete(sessionId);
      drawRoster();
    });

    // Positions are handled by the animation loop below, which runs at
    // the screen's own refresh rate and smoothly eases toward wherever
    // the server currently says each player is -- see requestAnimationFrame
    // loop at the bottom of this file.
    requestAnimationFrame(animate);

    room.onLeave(() => { statusEl.textContent = 'disconnected'; });
  } catch (e) {
    statusEl.textContent = 'could not connect — is the server running?';
    console.error(e);
  }
}

function draw() {
  if (!room || !room.state || !room.state.players) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.strokeRect(1, 1, cv.width - 2, cv.height - 2);

  // where you last tapped (drawn locally, just as a hint to yourself)
  if (myTarget) {
    const age = (Date.now() - myTarget.t) / 1000;
    if (age < 1.2) {
      ctx.globalAlpha = Math.max(0, 1 - age / 1.2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(myTarget.x, myTarget.y, 6 + age * 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else myTarget = null;
  }

  room.state.players.forEach((player, sessionId) => {
    const isMe = sessionId === mySessionId;
    // draw at the smoothed render position, not the raw server value --
    // this is what actually makes movement look continuous
    const r = renderPos.get(sessionId) || player;

    // "it" wears a pulsing red ring -- during their brief immunity it's
    // dimmed, so you can see at a glance when they can actually tag
    if (player.isIt) {
      const pulse = 1 + Math.sin(Date.now() / 140) * 0.12;
      ctx.globalAlpha = player.tagCooldown > 0 ? 0.35 : 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 21 * pulse, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ff3b30';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.beginPath();
    ctx.arc(r.x, r.y, 14, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    if (isMe) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }

    // Names matter once there are more than two dots on screen.
    ctx.fillStyle = isMe ? '#fff' : 'rgba(220,232,245,.7)';
    ctx.font = (isMe ? 'bold ' : '') + '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(player.name, r.x, r.y - 20);
  });
}

function drawRoster() {
  if (!room || !room.state || !room.state.players) return; // state not here yet
  const box = document.getElementById('roster');
  let html = '';
  room.state.players.forEach((player, sessionId) => {
    const me = sessionId === mySessionId ? ' (you)' : '';
    const it = player.isIt ? ' \u2014 IT' : '';
    html += `<span><i style="background:${player.color}"></i>${player.name}${me}` +
            `<b style="color:#ff3b30">${it}</b></span>`;
  });
  box.innerHTML = html;
  statusEl.textContent = `connected — ${room.state.players.size}/8 players`;
}

// ---- input: send an intent, never a position -----------------------
// Tap/click sends a DESTINATION. The server still controls how fast you
// travel there and keeps you inside the arena, so this isn't a teleport.
let myTarget = null;

function canvasPoint(clientX, clientY) {
  // The canvas is displayed scaled-down on small screens, so convert
  // from screen pixels back into the canvas's own coordinate space.
  const r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (cv.width / r.width),
    y: (clientY - r.top) * (cv.height / r.height),
  };
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!room) return;
  const p = canvasPoint(e.clientX, e.clientY);
  myTarget = { x: p.x, y: p.y, t: Date.now() };
  room.send('target', { x: p.x, y: p.y });
});

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let wasMoving = false;
setInterval(() => {
  if (!room) return;
  let x = 0, y = 0;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  const moving = (x !== 0 || y !== 0);
  // Send while a key is held, plus one final zero to stop. Staying quiet
  // when idle is what lets a tap destination survive.
  if (moving || wasMoving) {
    room.send('move', { x, y });
    if (moving) myTarget = null;
  }
  wasMoving = moving;
}, 1000 / 30);

main();
</script>
</body>
</html>
