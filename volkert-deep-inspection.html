<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>VOLKERT — Deep Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#03080E;}
body{font-family:'Oswald',sans-serif;color:#DCEAF2;touch-action:none;user-select:none;-webkit-user-select:none;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03080E;}
canvas{display:block;}
body.playing canvas{cursor:none;}
#safeprobe{position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none;}

.screen{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);
  background:radial-gradient(ellipse at 50% 42%, rgba(6,28,42,.72), rgba(2,7,13,.94));
  overflow-y:auto;
}
.screen.off{display:none;}
.brandline{font-size:11px;letter-spacing:.5em;color:#4FD1C5;font-weight:600;text-indent:.5em;margin-bottom:10px;}
h1{font-size:clamp(28px,8.5vw,46px);font-weight:700;letter-spacing:.06em;line-height:.95;color:#F2F8FB;text-transform:uppercase;}
h1 em{display:block;font-style:normal;font-size:.4em;letter-spacing:.34em;color:#7FA8BE;font-weight:400;margin-top:8px;text-indent:.34em;}

.difflist{width:100%;max-width:390px;margin:26px auto 0;display:flex;flex-direction:column;gap:9px;}
.diff{
  display:flex;align-items:center;gap:13px;width:100%;
  background:rgba(18,44,60,.5);border:1px solid rgba(79,209,197,.16);
  border-radius:4px;padding:13px 15px;cursor:pointer;text-align:left;
  transition:background .14s ease, border-color .14s ease, transform .1s ease;
}
.diff:hover{background:rgba(24,60,80,.7);border-color:rgba(79,209,197,.4);}
.diff:active{transform:scale(.985);}
.diff .txt{flex:1;min-width:0;}
.diff .nm{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:.06em;color:#EAF4F8;text-transform:uppercase;}
.diff .sb{font-family:'Roboto Mono',monospace;font-size:10.5px;color:#7C9FB4;margin-top:3px;letter-spacing:.02em;}
.diff .dots{display:flex;gap:4px;flex-shrink:0;}
.diff .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);display:block;}
.diff .dots i.on{background:#4FD1C5;}
.diff .dots i.hot{background:#E8564A;}
.diff .bestchip{
  font-family:'Roboto Mono',monospace;font-size:10px;color:#5F87A0;
  flex-shrink:0;min-width:30px;text-align:right;
}
.diff.revealed{border-color:rgba(232,86,74,.45);}
.diff.revealed .nm{color:#F0A79E;}

.blurb{font-family:'Roboto Mono',monospace;font-size:11.5px;line-height:1.85;color:#8FB3C7;max-width:330px;margin:20px auto 0;}
.blurb b{color:#4FD1C5;font-weight:700;}
.cta{
  margin-top:24px;border:none;border-radius:3px;background:#0FBFA8;color:#03181A;
  font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;
  padding:14px 40px;text-indent:.16em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 0 1px rgba(79,209,197,.4), 0 14px 34px -12px rgba(15,191,168,.7);
  transition:transform .1s ease;
}
.cta:active{transform:scale(.97);}
.ghostbtn{
  margin-top:14px;background:none;border:none;color:#5F87A0;
  font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.14em;
  cursor:pointer;text-decoration:underline;text-underline-offset:4px;
}
.hint{font-family:'Roboto Mono',monospace;font-size:10.5px;color:#5A7E92;margin-top:14px;letter-spacing:.08em;}
.scorewrap{display:flex;gap:34px;justify-content:center;margin:20px 0 4px;}
.sc{text-align:center;}
.sc .n{font-size:42px;font-weight:700;color:#F2F8FB;line-height:1;}
.sc .l{font-family:'Roboto Mono',monospace;font-size:9.5px;letter-spacing:.22em;color:#6B92A8;margin-top:7px;}
.verdict{font-family:'Roboto Mono',monospace;font-size:11.5px;color:#4FD1C5;letter-spacing:.09em;margin-top:14px;max-width:320px;line-height:1.7;}
.newbest{color:#F5C451;}
.diffTag{font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.2em;color:#6B92A8;margin-top:12px;}
</style>
</head>
<body>
<div id="safeprobe"></div>
<div id="wrap"><canvas id="cv"></canvas></div>

<!-- TITLE -->
<div class="screen" id="titleScreen">
  <div class="brandline">VOLKERT</div>
  <h1>Deep<br>Inspection<em>Pile Survey</em></h1>
  <div class="difflist" id="diffList"></div>
  <p class="blurb">
    <b>TAP</b> to kick down. Release to rise.<br>
    Thread the piles. Mind the channel bottom.
  </p>
  <div class="hint">select an assignment</div>
</div>

<!-- GAME OVER -->
<div class="screen off" id="overScreen">
  <div class="brandline" id="overTag">SURVEY TERMINATED</div>
  <h1 id="overTitle">Surfaced</h1>
  <div class="diffTag" id="overDiff"></div>
  <div class="scorewrap">
    <div class="sc"><div class="n" id="finalScore">0</div><div class="l">PILES</div></div>
    <div class="sc"><div class="n" id="bestScore">0</div><div class="l">BEST</div></div>
  </div>
  <div class="verdict" id="verdict"></div>
  <button class="cta" id="againBtn">Dive Again</button>
  <button class="ghostbtn" id="menuBtn">CHANGE ASSIGNMENT</button>
  <div class="hint">tap anywhere / space to retry</div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const dark=document.createElement('canvas'), dctx=dark.getContext('2d');
let W=0,H=0,DPR=1,UW=0,SPD=1,SAFE_T=0;
const MAX_AR=1.9;                      // letterbox anything wider than this
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const availW=window.innerWidth, availH=window.innerHeight;
  let cw=availW, ch=availH;
  if(cw/ch>MAX_AR) cw=Math.round(ch*MAX_AR);   // ultrawide -> side bars
  W=cw; H=ch;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  dark.width=W*DPR; dark.height=H*DPR; dctx.setTransform(DPR,0,0,DPR,0,0);
  // horizontal gameplay unit: stops piles ballooning on wide screens
  UW=Math.min(W, H*0.80);
  // scroll faster on wide screens so pile density stays readable
  SPD=Math.max(0.88, Math.min(1.55, W/(H*0.62)));
  const pr=document.getElementById('safeprobe');
  SAFE_T=pr?pr.offsetHeight:0;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) lastT=performance.now(); });
resize();

/* ================= difficulty ================= */
const DIFFS=[
 {id:'routine', name:'Routine Inspection', sub:'daylight ops, calm water', dots:1,
  gap:0.360, speed:0.235, spacing:2.05, chanVar:0.042, rebar:0.12, o2:1.35, cracks:3,
  lampAt:6, lampMin:1.1, lampMax:2.2, lampGapMin:9, lampGapMax:16,
  sharkAt:16, sharkSp:0.66, sharkGap:26, surge:0},

 {id:'cave', name:'Random Dude Cave Diving', sub:'recreational \u2014 no permit needed', dots:1, fake:true,
  gap:0.205, speed:0.395, spacing:1.14, chanVar:0.102, rebar:0.85, o2:2.55, cracks:2,
  lampAt:1, lampMin:2.4, lampMax:4.3, lampGapMin:4, lampGapMax:8,
  sharkAt:4, sharkSp:0.80, sharkGap:12, surge:0.10,
  realSub:'you knew. you clicked it anyway.', realDots:5},

 {id:'damage', name:'Damage Inspection', sub:'post-impact survey, silt heavy', dots:2,
  gap:0.305, speed:0.285, spacing:1.70, chanVar:0.062, rebar:0.38, o2:1.70, cracks:3,
  lampAt:4, lampMin:1.4, lampMax:2.6, lampGapMin:7, lampGapMax:13,
  sharkAt:11, sharkSp:0.70, sharkGap:21, surge:0.03},

 {id:'hurricane', name:'Emergency Hurricane', sub:'storm surge, zero vis, get it done', dots:3,
  gap:0.265, speed:0.335, spacing:1.42, chanVar:0.084, rebar:0.58, o2:2.05, cracks:3,
  lampAt:2, lampMin:1.8, lampMax:3.2, lampGapMin:5, lampGapMax:10,
  sharkAt:7, sharkSp:0.75, sharkGap:16, surge:0.085},
];
let bests={}, caveRevealed=false, chosen=DIFFS[0];

const DECK=0.085;
const T={kick:0.38, buoy:-0.80, vMax:0.65, bubbleO2:28};

/* ================= menu ================= */
function buildMenu(){
  const list=document.getElementById('diffList');
  list.innerHTML='';
  DIFFS.forEach(D=>{
    const revealed = D.fake && caveRevealed;
    const dots = revealed ? D.realDots : D.dots;
    const sub  = revealed ? D.realSub  : D.sub;
    const b=document.createElement('button');
    b.className='diff'+(revealed?' revealed':'');
    const bs=bests[D.id]||0;
    b.innerHTML=`
      <div class="txt">
        <div class="nm">${D.name}</div>
        <div class="sb">${sub}</div>
      </div>
      <div class="dots">${Array.from({length:5},(_,i)=>
        `<i class="${i<dots?(revealed?'hot':'on'):''}"></i>`).join('')}</div>
      <div class="bestchip">${bs?bs:'—'}</div>`;
    b.addEventListener('pointerdown',e=>{e.stopPropagation(); chosen=D; start();});
    list.appendChild(b);
  });
}

/* ================= state ================= */
let G=null, running=false, lastT=0;
function newGame(D){
  const g={
    D, t:0, score:0,
    diver:{x:W*0.27,y:H*0.42,vy:0,kickAnim:0},
    piles:[], bubbles:[], motes:[], cracks:[], terrain:[],
    spawnT:0.9, bubbleT:2.0,
    o2:100, crackCount:0, floorCool:0,
    lamp:{state:'on', timer:D.lampGapMin+Math.random()*4, flickers:0, level:1},
    shark:null, sharkT:D.sharkGap*0.7,
    shakeT:0, shakeMag:0, flashT:0,
    dead:false, deadT:0, reason:''
  };
  initTerrain(g); seedMotes(g);
  return g;
}
function seedMotes(g){
  g.motes=[];
  for(let i=0;i<70;i++) g.motes.push({
    x:Math.random()*W, y:H*DECK+Math.random()*(H*0.85-H*DECK),
    r:0.6+Math.random()*1.7, dr:Math.random()*6.28});
}

/* ================= channel bottom ================= */
const TSTEP=()=>UW*0.105;
function nextY(g,y){
  const v=H*g.D.chanVar;
  y += (Math.random()-0.5)*2*v;
  y += (H*0.875-y)*0.14;                 // drift toward the design channel depth
  return Math.max(H*0.695, Math.min(H*0.955, y));
}
function initTerrain(g){
  g.terrain=[];
  let x=-W*0.25, y=H*0.90;
  while(x<W*2.1){ g.terrain.push({x,y}); x+=TSTEP(); y=nextY(g,y); }
}
function terrainAt(g,x){
  const t=g.terrain;
  if(!t.length) return H*0.88;
  if(x<=t[0].x) return t[0].y;
  for(let i=0;i<t.length-1;i++){
    if(x>=t[i].x && x<=t[i+1].x){
      const f=(x-t[i].x)/(t[i+1].x-t[i].x);
      return t[i].y+(t[i+1].y-t[i].y)*f;
    }
  }
  return t[t.length-1].y;
}
function terrainHighest(g,x0,x1){   // smallest y = highest ground
  let m=Infinity;
  for(let x=x0;x<=x1;x+=Math.max(6,(x1-x0)/6)) m=Math.min(m,terrainAt(g,x));
  return m===Infinity?H*0.88:m;
}
function scrollTerrain(g,dx){
  for(const p of g.terrain) p.x-=dx;
  while(g.terrain.length && g.terrain[0].x < -W*0.35) g.terrain.shift();
  let last=g.terrain[g.terrain.length-1];
  while(last.x < W*2.1){
    const y=nextY(g,last.y);
    g.terrain.push({x:last.x+TSTEP(), y});
    last=g.terrain[g.terrain.length-1];
  }
}

/* ================= piles ================= */
function spawnPile(g){
  const D=g.D;
  const w=Math.max(30,UW*0.112);
  const x=W+w*0.6;
  const ground=terrainHighest(g,x,x+w);
  const gap=H*D.gap;
  const minBottom=H*DECK+H*0.10;
  let bottom=ground-gap;
  if(bottom<minBottom) bottom=minBottom;

  // rebar: reduces clearance locally, never past a passable minimum
  const rebar=[];
  const slack=(ground-bottom)-gap*0.60;
  if(Math.random()<D.rebar && slack>H*0.012){
    const n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      rebar.push({
        fx:0.14+Math.random()*0.72,
        len:(0.25+Math.random()*0.75)*slack,
        lean:(Math.random()-0.5)*0.5,
        kink:0.35+Math.random()*0.4
      });
    }
  }
  const jag=[];
  for(let i=0;i<=5;i++) jag.push({fx:i/5, dy:(Math.random()*0.9-0.15)*w*0.42});

  g.piles.push({x, w, bottom, jag, rebar, passed:false, hitCool:0,
    tint:Math.random()*0.18,
    barnacles:Array.from({length:9},()=>({fx:Math.random(),fy:Math.random(),r:1+Math.random()*2.2}))});
}
function pileEffBottom(p,x,tol){
  let b=p.bottom;
  for(const r of p.rebar){
    const rx=p.x+r.fx*p.w;
    if(Math.abs(x-rx)<tol) b=Math.max(b,p.bottom+r.len);
  }
  return b;
}

/* ================= input ================= */
function flap(){ if(running&&G&&!G.dead){ G.diver.vy=H*T.kick; G.diver.kickAnim=1; } }
function toMenu(){
  running=false;
  document.body.classList.remove('playing');
  document.getElementById('overScreen').classList.add('off');
  buildMenu();
  document.getElementById('titleScreen').classList.remove('off');
  G=newGame(chosen); preview();
}
window.addEventListener('keydown',e=>{
  if(e.code==='Escape' && running){ e.preventDefault(); toMenu(); }
});
function press(e){
  if(e.type==='keydown'&&e.code!=='Space') return;
  if(e.cancelable) e.preventDefault();
  if(!running){
    const over=document.getElementById('overScreen');
    if(!over.classList.contains('off') && G && G.deadT>0.7) start();
    return;
  }
  flap();
}
window.addEventListener('pointerdown',press,{passive:false});
window.addEventListener('keydown',press,{passive:false});
document.getElementById('againBtn').addEventListener('pointerdown',e=>{e.stopPropagation(); if(G&&G.deadT>0.5) start();});
document.getElementById('menuBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation(); toMenu();
});

function start(){
  document.getElementById('titleScreen').classList.add('off');
  document.getElementById('overScreen').classList.add('off');
  document.body.classList.add('playing');
  G=newGame(chosen); running=true; lastT=performance.now();
  requestAnimationFrame(loop);
}

/* ================= lamp ================= */
function updateLamp(g,dt){
  const L=g.lamp, D=g.D;
  L.timer-=dt;
  if(L.state==='on'){
    L.level+=(1-L.level)*Math.min(1,dt*8);
    if(L.timer<=0 && g.score>=D.lampAt){
      const near=g.piles.some(p=>p.x<g.diver.x+W*0.42 && p.x+p.w>g.diver.x-W*0.05);
      if(near) L.timer=0.4;
      else { L.state='flicker'; L.flickers=0; L.timer=0.09; }
    }
  } else if(L.state==='flicker'){
    L.level=(L.flickers%2===0)?0.12:0.95;
    if(L.timer<=0){
      L.flickers++; L.timer=(L.flickers%2===0)?0.09:0.12;
      if(L.flickers>=4){ L.state='out'; L.timer=D.lampMin+Math.random()*(D.lampMax-D.lampMin); L.level=0; }
    }
  } else {
    L.level+=(0-L.level)*Math.min(1,dt*10);
    if(L.timer<=0){ L.state='on'; L.timer=D.lampGapMin+Math.random()*(D.lampGapMax-D.lampGapMin); }
  }
}

/* ================= shark ================= */
function updateShark(g,dt){
  const D=g.D;
  if(g.shark){
    const s=g.shark; s.t+=dt;
    if(s.phase==='warn'){ if(s.t>1.25){ s.phase='telegraph'; s.t=0; } }
    else if(s.phase==='telegraph'){ if(s.t>0.95){ s.phase='lunge'; s.t=0; } }
    else {
      s.x-=H*D.sharkSp*SPD*dt;
      s.y+=Math.sin(s.t*6.5)*H*0.0035;
      if(s.x<-W*0.55) g.shark=null;
    }
    return;
  }
  if(g.score<D.sharkAt) return;
  if(g.lamp.state!=='on') return;
  g.sharkT-=dt;
  if(g.sharkT<=0){
    const lo=H*DECK+H*0.16, hi=terrainAt(g,W*0.6)-H*0.10;
    g.shark={x:W+W*0.28, y:lo+Math.random()*Math.max(H*0.1,hi-lo), phase:'warn', t:0, bit:false};
    g.sharkT=D.sharkGap+Math.random()*12;
  }
}

/* ================= damage ================= */
function takeHit(g,px,py){
  if(g.dead) return;
  g.crackCount++; g.shakeT=0.45; g.shakeMag=H*0.014; g.flashT=0.3;
  const cx=px??g.diver.x, cy=py??g.diver.y, arms=[];
  const n=6+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const segs=[]; let ax=0,ay=0,ang=Math.random()*6.28;
    for(let k=0;k<4;k++){
      const len=(0.08+Math.random()*0.2)*Math.max(W,H)*0.6;
      ang+=(Math.random()-0.5)*0.8;
      ax+=Math.cos(ang)*len; ay+=Math.sin(ang)*len;
      segs.push({x:ax,y:ay});
    }
    arms.push(segs);
  }
  g.cracks.push({cx,cy,arms,born:g.t});
  if(g.crackCount>=g.D.cracks) die(g,'MASK BREACHED');
}
function die(g,reason){
  if(g.dead) return;
  g.dead=true; g.deadT=0; g.reason=reason; g.shakeT=0.6; g.shakeMag=H*0.02;
}

/* ================= update ================= */
function update(dt){
  const g=G, D=g.D; g.t+=dt;
  if(g.dead){
    g.deadT+=dt;
    g.diver.vy+=-H*1.5*dt; g.diver.y+=g.diver.vy*dt;
    if(g.diver.y<H*DECK+H*0.03) g.diver.y=H*DECK+H*0.03;
    if(g.shakeT>0) g.shakeT-=dt;
    if(g.deadT>1.1 && running) endRun();
    return;
  }
  const sp=H*D.speed*SPD, dx=sp*dt, d=g.diver, dr=H*0.028;

  d.vy+=H*T.buoy*dt;
  if(D.surge) d.vy+=Math.sin(g.t*1.7)*H*D.surge*dt*6.5;
  d.vy=Math.max(-H*T.vMax,Math.min(H*T.vMax,d.vy));
  d.y+=d.vy*dt;
  d.kickAnim=Math.max(0,d.kickAnim-dt*3.2);

  const ceil=H*DECK+H*0.035;
  if(d.y<ceil){ d.y=ceil; d.vy=Math.max(d.vy,0); }

  scrollTerrain(g,dx);

  /* channel bottom */
  if(g.floorCool>0) g.floorCool-=dt;
  const ty=terrainAt(g,d.x);
  if(d.y+dr>ty){
    d.y=ty-dr; d.vy=Math.min(d.vy,-H*0.16);
    if(g.floorCool<=0){ g.floorCool=1.1; takeHit(g,d.x,d.y+dr*0.5); }
  }

  /* piles */
  g.spawnT-=dt;
  if(g.spawnT<=0){ spawnPile(g); g.spawnT=D.spacing; }
  for(let i=g.piles.length-1;i>=0;i--){
    const p=g.piles[i]; p.x-=dx;
    if(p.hitCool>0) p.hitCool-=dt;
    if(!p.passed && p.x+p.w<d.x){ p.passed=true; g.score++; }
    if(p.x+p.w<-60) g.piles.splice(i,1);
  }
  for(const p of g.piles){
    if(p.hitCool>0) continue;
    if(d.x+dr>p.x && d.x-dr<p.x+p.w){
      const eff=pileEffBottom(p,d.x,dr+Math.max(2,p.w*0.06));
      if(d.y-dr<eff){
        p.hitCool=1.0; takeHit(g,d.x+dr*0.4,d.y-dr*0.4);
        d.vy=H*0.40; break;
      }
    }
  }

  /* bubbles */
  g.bubbleT-=dt;
  if(g.bubbleT<=0){
    const lo=H*DECK+H*0.16, hi=terrainAt(g,W)-H*0.06;
    g.bubbles.push({x:W+20, y:lo+Math.random()*Math.max(H*0.1,hi-lo), r:H*0.017, ph:Math.random()*6.28});
    g.bubbleT=2.5+Math.random()*2.3;
  }
  for(let i=g.bubbles.length-1;i>=0;i--){
    const b=g.bubbles[i];
    b.x-=dx; b.y-=H*0.035*dt; b.ph+=dt*3;
    if(Math.hypot(b.x-d.x,b.y-d.y)<dr+b.r*1.15){
      g.o2=Math.min(100,g.o2+T.bubbleO2); g.bubbles.splice(i,1); continue;
    }
    if(b.x<-40||b.y<H*DECK) g.bubbles.splice(i,1);
  }

  /* oxygen */
  g.o2-=D.o2*(1+g.crackCount*0.62)*dt;
  if(g.o2<=0){ g.o2=0; die(g,'OUT OF AIR'); }

  updateLamp(g,dt);
  updateShark(g,dt);
  if(g.shark && g.shark.phase==='lunge' && !g.shark.bit){
    const s=g.shark;
    if(Math.abs(s.x-d.x)<W*0.085 && Math.abs(s.y-d.y)<H*0.048){
      s.bit=true; takeHit(g,d.x,d.y); d.vy=-H*0.28;
    }
  }

  for(const m of g.motes){
    m.x-=dx*0.28; m.dr+=dt*0.7; m.y+=Math.sin(m.dr)*0.15;
    if(m.x<-4){ m.x=W+4; m.y=H*DECK+Math.random()*(H*0.85-H*DECK); }
  }
  if(g.shakeT>0) g.shakeT-=dt;
  if(g.flashT>0) g.flashT-=dt;
}

/* ================= draw ================= */
function drawWater(){
  const gr=ctx.createLinearGradient(0,H*DECK,0,H);
  gr.addColorStop(0,'#0E3A4E'); gr.addColorStop(0.5,'#0A2635'); gr.addColorStop(1,'#061722');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
}
function drawDeck(){
  const y=H*DECK;
  ctx.fillStyle='#0A1119'; ctx.fillRect(0,0,W,y);
  ctx.fillStyle='#121C25'; ctx.fillRect(0,y-H*0.018,W,H*0.018);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let x=0;x<W;x+=W*0.09) ctx.fillRect(x,y-H*0.018,2,H*0.018);
}
function drawTerrain(g){
  const t=g.terrain; if(!t.length) return;
  ctx.beginPath(); ctx.moveTo(t[0].x,t[0].y);
  for(let i=1;i<t.length;i++){
    const p=t[i-1],c=t[i];
    ctx.quadraticCurveTo(p.x,p.y,(p.x+c.x)/2,(p.y+c.y)/2);
  }
  ctx.lineTo(t[t.length-1].x,H); ctx.lineTo(t[0].x,H); ctx.closePath();
  const gr=ctx.createLinearGradient(0,H*0.68,0,H);
  gr.addColorStop(0,'#16303C'); gr.addColorStop(0.35,'#0F212B'); gr.addColorStop(1,'#060E14');
  ctx.fillStyle=gr; ctx.fill();
  ctx.strokeStyle='rgba(120,175,180,.20)'; ctx.lineWidth=2; ctx.stroke();
  // silt haze hugging the bed
  ctx.save(); ctx.clip();
  ctx.fillStyle='rgba(90,130,140,.07)';
  for(let i=0;i<t.length;i++) ctx.fillRect(t[i].x-TSTEP()/2,t[i].y,TSTEP(),H*0.02);
  ctx.restore();
}
function drawRebar(p){
  const top=H*DECK;
  for(const r of p.rebar){
    const rx=p.x+r.fx*p.w, ry=p.bottom-p.w*0.05;
    ctx.strokeStyle='rgba(96,84,62,.62)';       // deliberately low contrast
    ctx.lineWidth=Math.max(1.6,p.w*0.055);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(rx,ry);
    const midY=ry+r.len*r.kink;
    ctx.lineTo(rx+r.lean*p.w*0.35, midY);
    ctx.lineTo(rx+r.lean*p.w*0.12, ry+r.len);
    ctx.stroke();
    ctx.strokeStyle='rgba(168,142,96,.30)'; ctx.lineWidth=Math.max(.8,p.w*0.02);
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx+r.lean*p.w*0.35,midY); ctx.stroke();
  }
}
function drawPile(p){
  const top=H*DECK;
  const bg=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
  bg.addColorStop(0,`rgba(${86+p.tint*40},${96+p.tint*40},${104+p.tint*40},1)`);
  bg.addColorStop(0.35,`rgba(${120+p.tint*40},${132+p.tint*40},${140+p.tint*40},1)`);
  bg.addColorStop(1,`rgba(${58+p.tint*30},${68+p.tint*30},${76+p.tint*30},1)`);
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.moveTo(p.x,top); ctx.lineTo(p.x+p.w,top);
  for(let i=p.jag.length-1;i>=0;i--) ctx.lineTo(p.x+p.jag[i].fx*p.w, p.bottom+p.jag[i].dy);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(p.x+p.w*0.3,top+H*0.06);
  ctx.lineTo(p.x+p.w*0.62,top+H*0.16);
  ctx.lineTo(p.x+p.w*0.38,top+H*0.27);
  ctx.stroke();
  ctx.fillStyle='rgba(70,110,95,.5)';
  for(const b of p.barnacles){
    ctx.beginPath(); ctx.arc(p.x+b.fx*p.w, top+b.fy*(p.bottom-top), b.r, 0, 6.28); ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(p.x,top,p.w*0.18,p.bottom-top);
  drawRebar(p);
}
function drawDiver(g){
  const d=g.diver, r=H*0.028;
  ctx.save(); ctx.translate(d.x,d.y);
  ctx.rotate(Math.max(-0.5,Math.min(0.6,d.vy/(H*0.9)))*0.7);
  ctx.fillStyle='#D8A93B';
  ctx.beginPath(); ctx.roundRect(-r*1.5,-r*0.5,r*0.85,r*1.5,r*0.3); ctx.fill();
  const kick=Math.sin(g.t*16)*(0.5+d.kickAnim*0.9);
  ctx.fillStyle='#16323F';
  ctx.save(); ctx.translate(-r*1.5,r*0.2); ctx.rotate(kick*0.5);
  ctx.beginPath(); ctx.ellipse(-r*0.5,0,r*0.75,r*0.3,0,0,6.28); ctx.fill(); ctx.restore();
  ctx.fillStyle='#1D4557';
  ctx.beginPath(); ctx.ellipse(0,0,r*1.35,r*0.82,0,0,6.28); ctx.fill();
  ctx.fillStyle='#0FBFA8';
  ctx.beginPath(); ctx.ellipse(-r*0.15,r*0.15,r*0.9,r*0.3,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#1D4557'; ctx.lineWidth=r*0.34; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(r*0.5,r*0.1); ctx.lineTo(r*1.1,r*0.45); ctx.stroke();
  ctx.fillStyle='#E8B93F';
  ctx.beginPath(); ctx.arc(r*0.72,-r*0.28,r*0.62,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(150,225,235,.55)';
  ctx.beginPath(); ctx.arc(r*0.9,-r*0.2,r*0.34,0,6.28); ctx.fill();
  ctx.fillStyle=g.lamp.level>0.4?'#FFF3C4':'#5A6068';
  ctx.beginPath(); ctx.arc(r*1.15,-r*0.55,r*0.2,0,6.28); ctx.fill();
  ctx.restore();
}
function drawSharkAlert(g){
  const s=g.shark; if(!s||s.phase==='lunge') return;
  const warn=s.phase==='warn';
  const rate=warn?9:17;                          // telegraph blinks faster
  const blink=Math.sin(s.t*rate)>-0.15;
  const y=Math.max(H*0.10,Math.min(H*0.90,s.y));
  const size=Math.round(Math.min(H*0.085,W*0.17));
  const x=W-Math.max(size*0.85,W*0.075);
  ctx.save();
  // red glow bleeding in from the edge, so peripheral vision catches it
  const bandH=H*0.19, bw=W*0.30;
  const grd=ctx.createLinearGradient(W,0,W-bw,0);
  grd.addColorStop(0,`rgba(236,42,32,${(warn?0.34:0.52)*(blink?1:0.4)})`);
  grd.addColorStop(1,'rgba(236,42,32,0)');
  ctx.fillStyle=grd; ctx.fillRect(W-bw,y-bandH/2,bw,bandH);
  if(blink){
    ctx.font=`700 ${size}px Oswald, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=Math.max(4,size*0.14); ctx.lineJoin='round';
    ctx.strokeStyle='rgba(26,2,0,.9)'; ctx.strokeText('!',x,y);
    ctx.fillStyle='#FF3325'; ctx.fillText('!',x,y);
    ctx.strokeStyle='rgba(255,51,37,.9)'; ctx.lineWidth=Math.max(2.5,size*0.06);
    ctx.beginPath();
    ctx.arc(x,y,size*0.78+Math.sin(s.t*rate)*size*0.1,0,6.28); ctx.stroke();
    ctx.strokeStyle='rgba(255,110,90,.8)'; ctx.lineWidth=Math.max(2.5,size*0.06);
    for(let i=0;i<2;i++){
      const cx=x-size*1.05-i*size*0.34;
      ctx.beginPath();
      ctx.moveTo(cx+size*0.14,y-size*0.21);
      ctx.lineTo(cx-size*0.06,y);
      ctx.lineTo(cx+size*0.14,y+size*0.21);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawShark(g){
  const s=g.shark; if(!s||s.phase!=='lunge') return;
  ctx.save(); ctx.translate(s.x,s.y);
  const L=H*0.13;
  ctx.fillStyle='#243A44';
  ctx.beginPath();
  ctx.moveTo(-L*0.95,0);
  ctx.quadraticCurveTo(-L*0.3,-L*0.32,L*0.55,-L*0.12);
  ctx.quadraticCurveTo(L*0.95,0,L*0.55,L*0.12);
  ctx.quadraticCurveTo(-L*0.3,L*0.3,-L*0.95,0);
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(-L*0.9,0); ctx.lineTo(-L*1.35,-L*0.3);
  ctx.lineTo(-L*1.15,0); ctx.lineTo(-L*1.35,L*0.3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-L*0.1,-L*0.26); ctx.lineTo(L*0.05,-L*0.55); ctx.lineTo(L*0.2,-L*0.24); ctx.fill();
  for(let i=0;i<2;i++){
    ctx.save(); ctx.translate(-L*0.1+i*L*0.38, L*0.22);
    ctx.rotate(Math.sin(s.t*9+i)*0.3);
    ctx.fillStyle='#1A2C34';
    ctx.beginPath(); ctx.roundRect(-L*0.06,0,L*0.12,L*0.2,L*0.05); ctx.fill();
    ctx.fillStyle='#C9D6DC';
    for(let k=0;k<3;k++){
      ctx.beginPath();
      ctx.moveTo(-L*0.05+k*L*0.05,L*0.2);
      ctx.lineTo(-L*0.03+k*L*0.05,L*0.31);
      ctx.lineTo(-L*0.01+k*L*0.05,L*0.2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.fillStyle='#F0F5F7';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(L*0.2+i*L*0.08,L*0.06);
    ctx.lineTo(L*0.24+i*L*0.08,L*0.17);
    ctx.lineTo(L*0.28+i*L*0.08,L*0.06); ctx.fill();
  }
  ctx.fillStyle='#F5C451';
  ctx.beginPath(); ctx.arc(L*0.34,-L*0.1,L*0.045,0,6.28); ctx.fill();
  ctx.restore();
}
function drawBubbles(g){
  for(const b of g.bubbles){
    const wob=Math.sin(b.ph)*b.r*0.2;
    ctx.strokeStyle='rgba(190,240,250,.85)'; ctx.lineWidth=1.6;
    ctx.fillStyle='rgba(150,225,245,.2)';
    ctx.beginPath(); ctx.arc(b.x+wob,b.y,b.r,0,6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(b.x+wob-b.r*0.32,b.y-b.r*0.34,b.r*0.2,0,6.28); ctx.fill();
  }
}
function drawMotes(g){
  ctx.fillStyle='rgba(190,225,240,.28)';
  for(const m of g.motes){ ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.28); ctx.fill(); }
}
function drawDarkness(g){
  const lvl=g.lamp.level, amt=g.lamp.state==='out'?0.945:0.86, d=g.diver;
  dctx.clearRect(0,0,W,H);
  dctx.fillStyle=`rgba(2,10,18,${amt})`; dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='destination-out';
  const halo=dctx.createRadialGradient(d.x,d.y,0,d.x,d.y,H*0.11);
  halo.addColorStop(0,`rgba(0,0,0,${0.55+lvl*0.25})`); halo.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=halo; dctx.beginPath(); dctx.arc(d.x,d.y,H*0.11,0,6.28); dctx.fill();
  if(lvl>0.02){
    const len=H*0.72*(0.55+lvl*0.45), spread=0.42;
    dctx.save(); dctx.beginPath(); dctx.moveTo(d.x,d.y);
    dctx.arc(d.x,d.y,len,-spread,spread); dctx.closePath(); dctx.clip();
    const cone=dctx.createRadialGradient(d.x,d.y,H*0.02,d.x,d.y,len);
    cone.addColorStop(0,`rgba(0,0,0,${0.96*lvl})`);
    cone.addColorStop(0.55,`rgba(0,0,0,${0.62*lvl})`);
    cone.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=cone; dctx.fillRect(d.x-len,d.y-len,len*2,len*2); dctx.restore();
  }
  dctx.globalCompositeOperation='source-over';
  ctx.drawImage(dark,0,0,W,H);
  if(lvl>0.02){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const len=H*0.72*(0.55+lvl*0.45);
    const sp2=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,len);
    sp2.addColorStop(0,`rgba(255,238,180,${0.13*lvl})`); sp2.addColorStop(1,'rgba(255,238,180,0)');
    ctx.fillStyle=sp2; ctx.beginPath(); ctx.moveTo(d.x,d.y);
    ctx.arc(d.x,d.y,len,-0.42,0.42); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}
function drawCracks(g){
  if(!g.cracks.length) return;
  ctx.save();
  for(const c of g.cracks){
    const grow=Math.min(1,(g.t-c.born)*4);
    ctx.strokeStyle='rgba(226,244,252,.7)'; ctx.lineWidth=1.7; ctx.lineJoin='round';
    ctx.shadowColor='rgba(160,220,240,.85)'; ctx.shadowBlur=5;
    for(const arm of c.arms){
      ctx.beginPath(); ctx.moveTo(c.cx,c.cy);
      for(const s of arm) ctx.lineTo(c.cx+s.x*grow,c.cy+s.y*grow);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=4;
    for(const arm of c.arms){
      ctx.beginPath(); ctx.moveTo(c.cx,c.cy);
      ctx.lineTo(c.cx+arm[0].x*grow,c.cy+arm[0].y*grow); ctx.stroke();
    }
    const rg=ctx.createRadialGradient(c.cx,c.cy,0,c.cx,c.cy,H*0.1);
    rg.addColorStop(0,'rgba(210,240,250,.16)'); rg.addColorStop(1,'rgba(210,240,250,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(c.cx,c.cy,H*0.1,0,6.28); ctx.fill();
  }
  ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.72);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,`rgba(4,14,22,${0.16*g.crackCount})`);
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}
function drawHUD(g){
  const pad=Math.max(16,Math.min(W,H*0.8)*0.05), top=SAFE_T+pad*0.7+(H>700?10:2);
  ctx.textBaseline='top';
  ctx.fillStyle='rgba(242,248,251,.95)';
  ctx.font=`700 ${Math.round(H*0.052)}px Oswald, sans-serif`;
  ctx.textAlign='left'; ctx.fillText(g.score,pad,top);
  ctx.fillStyle='rgba(127,168,190,.8)';
  ctx.font=`400 ${Math.round(H*0.013)}px 'Roboto Mono', monospace`;
  ctx.fillText('PILES',pad+2,top+H*0.056);

  const bw=Math.min(W*0.42,240), bh=Math.max(7,H*0.011), bx=W-pad-bw, by=top+H*0.012;
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,bh/2); ctx.fill();
  const frac=Math.max(0,g.o2/100), low=frac<0.25;
  const pulse=low?(0.6+Math.sin(g.t*9)*0.4):1;
  ctx.fillStyle=low?`rgba(232,86,74,${pulse})`:frac<0.5?'#F5C451':'#4FD1C5';
  ctx.beginPath(); ctx.roundRect(bx,by,Math.max(2,bw*frac),bh,bh/2); ctx.fill();
  ctx.fillStyle='rgba(127,168,190,.85)';
  ctx.font=`400 ${Math.round(H*0.013)}px 'Roboto Mono', monospace`;
  ctx.textAlign='right'; ctx.fillText('O₂',W-pad,by+bh+7);

  const pipR=Math.max(4,H*0.0065);
  for(let i=0;i<g.D.cracks;i++){
    ctx.beginPath(); ctx.arc(W-pad-i*(pipR*3.2), by+bh+H*0.036, pipR,0,6.28);
    ctx.fillStyle=i<(g.D.cracks-g.crackCount)?'rgba(79,209,197,.9)':'rgba(232,86,74,.35)';
    ctx.fill();
  }
  ctx.textAlign='center';
  ctx.font=`400 ${Math.round(H*0.0115)}px 'Roboto Mono', monospace`;
  ctx.fillStyle='rgba(107,146,168,.5)';
  ctx.fillText(g.D.name.toUpperCase(),W/2,top+2);
  if(g.lamp.state!=='on'){
    ctx.fillStyle=`rgba(245,196,81,${0.5+Math.sin(g.t*10)*0.4})`;
    ctx.font=`400 ${Math.round(H*0.015)}px 'Roboto Mono', monospace`;
    ctx.fillText('LAMP FAILURE',W/2,H*0.062);
  }
  if(g.o2<25){
    ctx.fillStyle=`rgba(232,86,74,${0.5+Math.sin(g.t*8)*0.4})`;
    ctx.font=`400 ${Math.round(H*0.015)}px 'Roboto Mono', monospace`;
    ctx.fillText('AIR LOW',W/2,H*0.09);
  }
}
function render(){
  const g=G;
  ctx.save();
  if(g.shakeT>0){
    const m=g.shakeMag*(g.shakeT/0.45);
    ctx.translate((Math.random()-0.5)*m,(Math.random()-0.5)*m);
  }
  drawWater(); drawDeck(); drawTerrain(g); drawMotes(g);
  for(const p of g.piles) drawPile(p);
  drawBubbles(g); drawShark(g); drawDiver(g); drawDarkness(g);
  ctx.restore();
  drawCracks(g);
  drawSharkAlert(g);
  if(g.flashT>0){ ctx.fillStyle=`rgba(230,245,255,${g.flashT*0.5})`; ctx.fillRect(0,0,W,H); }
  drawHUD(g);
}
function loop(now){
  if(!running) return;
  let dt=(now-lastT)/1000; lastT=now;
  update(Math.min(dt,0.05)); render();
  requestAnimationFrame(loop);
}

/* ================= end ================= */
function endRun(){
  running=false;
  document.body.classList.remove('playing');
  const g=G, D=g.D;
  const prev=bests[D.id]||0, isBest=g.score>prev;
  if(isBest){ bests[D.id]=g.score; save(); }
  if(D.fake && !caveRevealed){ caveRevealed=true; save(); }
  document.getElementById('finalScore').textContent=g.score;
  document.getElementById('bestScore').textContent=bests[D.id]||0;
  document.getElementById('overTag').textContent=g.reason||'SURVEY TERMINATED';
  document.getElementById('overDiff').textContent=D.name.toUpperCase();
  document.getElementById('overTitle').textContent=
    g.score>=30?'Veteran':g.score>=15?'Solid Run':g.score>=5?'Surfaced':'Aborted';
  const v=document.getElementById('verdict');
  v.classList.toggle('newbest',isBest&&g.score>0);
  if(D.fake && g.score<5) v.textContent='turns out one dot was not the whole story.';
  else if(isBest&&g.score>0) v.textContent='◆ NEW PERSONAL BEST';
  else if(g.reason==='OUT OF AIR') v.textContent='watch for bubbles — detour for them early';
  else v.textContent='rebar hangs lower than it looks';
  document.getElementById('overScreen').classList.remove('off');
  buildMenu();
}

/* ================= persistence ================= */
async function save(){
  try{ await window.storage.set('dive:v2', JSON.stringify({bests,caveRevealed})); }catch(e){}
}
async function load(){
  try{
    const r=await window.storage.get('dive:v2');
    if(r&&r.value){ const o=JSON.parse(r.value); bests=o.bests||{}; caveRevealed=!!o.caveRevealed; }
  }catch(e){}
  buildMenu();
}

/* ================= idle preview ================= */
function preview(){
  let t=performance.now();
  function tick(now){
    if(running) return;
    const dt=Math.min((now-t)/1000,0.05); t=now;
    G.t+=dt;
    G.lamp.level=1; G.lamp.state='on';
    G.diver.y=H*0.42+Math.sin(G.t*0.9)*H*0.05;
    G.diver.vy=Math.cos(G.t*0.9)*H*0.05;
    scrollTerrain(G,H*0.10*dt);
    for(const m of G.motes){ m.x-=H*0.06*dt; if(m.x<-4) m.x=W+4; }
    drawWater(); drawDeck(); drawTerrain(G); drawMotes(G); drawDiver(G); drawDarkness(G);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

buildMenu();
if(window.storage) load();
G=newGame(DIFFS[0]);
preview();
</script>
