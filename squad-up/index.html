<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Up</title>
<script>
/* ==========================================================================
   THE ONE LINE TO EDIT: where the Squad Up server lives on Render.
   Paste the address Render gives you (no slash at the end), e.g.
     const APP = "https://squad-up.onrender.com";
   ========================================================================== */
const APP = "https://YOUR-SERVICE.onrender.com";
</script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html{
    background:#f4f8fb repeating-linear-gradient(0deg, transparent 0 7px, rgba(120,170,210,.10) 7px 8px);
    min-height:100%;
  }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
    font-family:'M PLUS Rounded 1c', system-ui, sans-serif; color:#3a4a58;
  }
  .bubble{
    text-align:center; padding:34px 40px 30px; border-radius:28px; max-width:340px; width:100%;
    background:linear-gradient(#fff, #eef5fa);
    border:2px solid #fff;
    box-shadow:0 10px 28px -12px rgba(40,90,140,.35), inset 0 -3px 0 rgba(120,170,210,.15);
  }
  h1{
    margin:0 0 18px; font-size:34px; font-weight:800; letter-spacing:-.01em;
    background:linear-gradient(90deg, hsl(4 75% 55%), hsl(46 85% 45%), hsl(128 55% 42%), hsl(192 70% 45%), hsl(262 60% 58%));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .dots{ display:flex; gap:9px; justify-content:center; height:16px; }
  .dots i{
    width:14px; height:14px; border-radius:50%; display:block;
    background:radial-gradient(circle at 35% 30%, #fff 0 18%, hsl(var(--h) 75% 55%) 45%);
    box-shadow:0 2px 5px hsl(var(--h) 60% 40% / .35);
    animation:hop 1s ease-in-out infinite;
  }
  .dots i:nth-child(1){ --h:4; }
  .dots i:nth-child(2){ --h:46;  animation-delay:.12s; }
  .dots i:nth-child(3){ --h:192; animation-delay:.24s; }
  .dots i:nth-child(4){ --h:296; animation-delay:.36s; }
  @keyframes hop{ 0%,100%{ transform:translateY(0) } 40%{ transform:translateY(-8px) } }
  p{ margin:16px 0 0; font-size:15px; color:#6a7c8c; min-height:1.4em; }
  a.btn{
    display:none; margin-top:18px; padding:12px 26px; border-radius:999px; text-decoration:none;
    font-weight:800; color:#fff; background:linear-gradient(hsl(192 80% 58%), hsl(192 75% 44%));
    box-shadow:0 6px 14px -6px hsl(192 70% 35% / .6), inset 0 1px 0 rgba(255,255,255,.5);
  }
  @media (prefers-reduced-motion: reduce){ .dots i{ animation:none; } }
</style>
</head>
<body>
  <div class="bubble">
    <h1>Squad Up</h1>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <p id="msg"></p>
    <a class="btn" id="go">Open</a>
  </div>

<script>
(function(){
  "use strict";
  var msg = document.getElementById("msg");
  var go  = document.getElementById("go");
  var target = APP.replace(/\/+$/, "") + "/squadup";

  if (APP.indexOf("YOUR-SERVICE") !== -1) {
    msg.textContent = "Not set up yet.";
    document.querySelector(".dots").style.display = "none";
    return;
  }

  go.href = target;
  var done = false;
  function open(){ if (!done) { done = true; location.replace(target); } }

  // The free server naps when nobody's using it. Ping it first so people see
  // this page instead of a blank screen while it wakes, then hop over.
  var slow = setTimeout(function(){ msg.textContent = "Waking up…"; }, 1500);
  setTimeout(function(){ go.style.display = "inline-block"; }, 20000);

  fetch(APP.replace(/\/+$/, "") + "/health", { mode: "no-cors", cache: "no-store" })
    .then(function(){ clearTimeout(slow); open(); })
    .catch(function(){
      clearTimeout(slow);
      msg.textContent = "Couldn't reach it. Try again in a minute.";
      go.style.display = "inline-block";
    });

  // never strand anyone: after 75s just go, the server will answer when ready
  setTimeout(open, 75000);
})();
</script>
</body>
</html>
