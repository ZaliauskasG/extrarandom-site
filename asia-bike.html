<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Southeast by Bicycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#10131a;}
body{
  font-family:"Chivo",system-ui,sans-serif;color:#F5EFE3;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{position:relative;width:100%;height:100%;overflow:hidden;}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}

.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:22px;gap:14px;background:rgba(10,13,20,.86);backdrop-filter:blur(3px);
  z-index:5;
}
.screen.hide{display:none;}
h1{font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:-.02em;line-height:.95;}
h1 em{font-style:normal;color:#F2B441;display:block;font-size:.52em;letter-spacing:.16em;
  font-weight:700;margin-bottom:6px;}
h2{font-size:clamp(21px,5vw,32px);font-weight:900;}
p{font-size:15px;color:#B9B0A0;max-width:30ch;line-height:1.5;}
.btn{
  font:700 17px "Chivo",sans-serif;color:#10131a;background:#F2B441;
  border:0;padding:14px 30px;cursor:pointer;border-radius:2px;
  box-shadow:0 4px 0 #A9741C;transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A9741C;}
.btn.alt{background:#3B4457;color:#F5EFE3;box-shadow:0 4px 0 #222835;}
.keys{font-size:12.5px;color:#7F8798;line-height:1.7;}
.dish{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:340px;}
.dish span{font-size:12px;background:#222a38;padding:5px 9px;border-radius:2px;color:#D8CFBD;}
.flag{font-size:13px;letter-spacing:.22em;color:#F2B441;font-weight:700;}

/* touch: the whole screen splits into an upper and a lower half, which is
   the natural mapping when the thing you are moving goes up and down */
#pad{position:absolute;inset:0;display:none;z-index:4;}
#pad.on{display:block;}
#pad div{position:absolute;left:0;width:100%;height:50%;}
#pad .up{top:0;} #pad .dn{bottom:0;}
#pad .up:active,#pad .dn:active{background:rgba(245,239,227,.05);}

/* portrait is unplayable at 16:9 -- ask for a turn rather than shrink */
#rotate{
  position:absolute;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:#0B0E14;text-align:center;padding:26px;
}
#rotate.show{display:flex;}
#rotate .ph{
  width:52px;height:86px;border:3px solid #F2B441;border-radius:7px;
  animation:turn 1.9s ease-in-out infinite;
}
@keyframes turn{0%,42%{transform:rotate(0)}58%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg);}}
.hintbar{position:absolute;left:0;right:0;top:8px;text-align:center;
  font-size:11px;color:rgba(245,239,227,.55);z-index:3;pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="screen" id="scTitle">
    <h1><em>SOUTHEAST</em>by Bicycle</h1>
    <p>Nine rides through Thailand, Laos and Vietnam. Dodge the traffic,
       eat what the country feeds you, and don't run empty.</p>
    <button class="btn" id="btnStart">Start riding</button>
    <div class="keys" id="howto"></div>
  </div>

  <div class="screen hide" id="scBrief">
    <div class="flag" id="bFlag"></div>
    <h2 id="bTitle"></h2>
    <p id="bText"></p>
    <div class="dish" id="bDish"></div>
    <button class="btn" id="btnGo">Ride</button>
  </div>

  <div class="screen hide" id="scClear">
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <button class="btn" id="btnNext">Onward</button>
  </div>

  <div class="screen hide" id="scOver">
    <h2 id="oTitle"></h2>
    <p id="oText"></p>
    <button class="btn" id="btnRetry">Try again</button>
    <button class="btn alt" id="btnQuit">Back to the map</button>
  </div>

  <div id="pad"><div class="up"></div><div class="dn"></div></div>
  <div id="rotate"><div class="ph"></div><p>Turn your phone sideways.</p></div>
  <div class="hintbar" id="hint"></div>
</div>

/* ---------- setup ---------- */
const VW = 480, VH = 270;                 // virtual resolution, scaled to fit
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d", { alpha:false });
const $ = id => document.getElementById(id);
let scale = 1, offX = 0, offY = 0;

const IMG = {};
function loadArt(done){
  const keys = Object.keys(SPRITES);
  let left = keys.length;
  if (!left) return done();
  keys.forEach(k => {
    const im = new Image();
    im.onload = im.onerror = () => { if (--left === 0) done(); };
    im.src = SPRITES[k];
    IMG[k] = im;
  });
}

function fit(){
  const w = innerWidth, h = innerHeight;
  cvs.width = Math.floor(w); cvs.height = Math.floor(h);
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", fit);

const TOUCH = matchMedia("(pointer:coarse)").matches;
$("howto").innerHTML = TOUCH
  ? "Swipe up and down to change lane, left and right to slide through the gaps."
  : "\u2191 \u2193 change lane &nbsp;\u2022&nbsp; \u2190 \u2192 slide back and forward through the traffic";

function checkOrientation(){
  // only nag on a phone, and only when it is actually taller than it is wide
  const portrait = TOUCH && innerHeight > innerWidth * 1.04;
  $("rotate").classList.toggle("show", portrait);
}
addEventListener("resize", checkOrientation);
addEventListener("orientationchange", () => setTimeout(checkOrientation, 220));

/* ---------- the road ----------
   Lane positions are measured off the painted background: the asphalt runs
   from y=172 to y=240, so three lanes sit inside it. */
const SPLIT = 172;                        // where the scenery strip ends
const LANES = [190, 212, 234];            // inside the painted asphalt (172-247)
const ROAD_TOP = SPLIT;
const NUDGE_MIN = 52, NUDGE_MAX = 210;    // how far along the road you can sit
const NUDGE_STEP = 26;

/* ---------- countries ----------
   Only five food sprites exist, so dishes reuse them with the right name per
   country -- a noodle bowl is khao piak sen in Laos and pho in Vietnam. */
const COUNTRIES = [
  { name:"Thailand", flag:"THAILAND",
    bg:"th",
    blurb:"Out of Chiang Mai, south through the rice terraces. The traffic is "
        + "cheerful and completely unbothered by you.",
    dishes:[
      { key:"food_moo_ping",          name:"Moo Ping",          fill:26 },
      { key:"food_mango_sticky_rice", name:"Mango Sticky Rice", fill:30 },
      { key:"food_tom_yum",           name:"Tom Yum",           fill:24 },
      { key:"food_coconut_water",     name:"Coconut Water",     fill:18 }
    ],
    traffic:["moto","scooter","tuktuk","car"] },

  { name:"Laos", flag:"LAOS",
    bg:"lo",
    blurb:"The road along the Mekong. Fewer cars, more potholes, and every "
        + "guesthouse throws in sticky rice.",
    dishes:[
      { key:"food_khao_piak_sen", name:"Khao Piak Sen", fill:28 },
      { key:"food_ping_gai",      name:"Ping Gai",      fill:26 },
      { key:"food_khao_niao",     name:"Khao Niao",     fill:22 },

    ],

    bg:"vn",

      { key:"food_pho",      name:"Ph\u1EDF",                 fill:30 },
      { key:"food_banh_mi",  name:"B\u00E1nh M\u00EC",         fill:28 },

      { key:"food_nuoc_dua", name:"N\u01B0\u1EDBc D\u1EEBa",  fill:18 }
    ],
    traffic:["moto","scooter","car","moto"] }
];

const LEVELS = [];
COUNTRIES.forEach((c, ci) => {
  for (let i = 0; i < 3; i++) {
    const n = ci * 3 + i;
    LEVELS.push({
      country: ci, idx: i,
      // n counts 0..8 across the whole trip, so every stop is a step up on
      // the one before it rather than resetting at each border
      dist:    1350 + n * 260,                  // metres to ride
      density: 0.45 + n * 0.16,                 // traffic pressure
      speed:   104 + n * 7,                     // the bike's pace, set by the level
      drain:   2.2 + n * 0.16                   // hunger per second
    });
  }
});

/* ---------- persistent progress ---------- */
let unlocked = 0;
try {
  unlocked = Math.max(0, Math.min(LEVELS.length - 1, +localStorage.getItem("sbb_unlocked") || 0));
} catch (e) { unlocked = 0; }
function saveProgress(){
  try {
    localStorage.setItem("sbb_unlocked", String(unlocked));
    localStorage.setItem("sbb_eaten", String(totalEaten));
  } catch (e) {}
}

/* ---------- state ---------- */
let mode = "title";        // title | map | play | clear | over
let cur = 0;               // which level is selected on the map
let W = null;              // live level state
let mapWalk = { at:0, to:0, t:1 };
let totalEaten = 0;      // meals across the whole trip
try { totalEaten = Math.max(0, +localStorage.getItem("sbb_eaten") || 0); } catch (e) { totalEaten = 0; }

/* ---------- input ----------
   Lane changes are queued as a count, not a boolean: two taps landing inside
   one frame must both register, or fast weaving silently drops inputs. */
const held = { up:false, down:false, left:false, right:false };
let laneQueue = 0, nudgeQueue = 0;

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","w","arrowdown","s","arrowleft","a","arrowright","d"," "].includes(k)) e.preventDefault();
  if (k === "arrowup" || k === "w")    { if (!held.up)    laneQueue--;  held.up = true; }
  if (k === "arrowdown" || k === "s")  { if (!held.down)  laneQueue++;  held.down = true; }
  if (k === "arrowleft" || k === "a")  { if (!held.left)  nudgeQueue--; held.left = true; }
  if (k === "arrowright" || k === "d") { if (!held.right) nudgeQueue++; held.right = true; }
});
addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "w")    held.up = false;
  if (k === "arrowdown" || k === "s")  held.down = false;
  if (k === "arrowleft" || k === "a")  held.left = false;
  if (k === "arrowright" || k === "d") held.right = false;
});
/* Touch: tapping a half moves that way, and a vertical swipe anywhere does
   too -- whichever the player reaches for first. A swipe suppresses the tap
   so one gesture never counts twice. */
const pad = $("pad");
let swipeX = null, swipeY = null, swiped = false;
pad.addEventListener("pointerdown", e => {
  e.preventDefault();
  swipeX = e.clientX; swipeY = e.clientY; swiped = false;
}, { passive:false });
pad.addEventListener("pointermove", e => {
  if (swipeY === null || swiped) return;
  const dx = e.clientX - swipeX, dy = e.clientY - swipeY;
  // the dominant axis decides: vertical swaps lane, horizontal slides you
  // forward or back along the road
  if (Math.abs(dy) > 26 && Math.abs(dy) >= Math.abs(dx)){
    laneQueue += dy > 0 ? 1 : -1; swiped = true;
  } else if (Math.abs(dx) > 26){
    nudgeQueue += dx > 0 ? 1 : -1; swiped = true;
  }
}, { passive:true });
pad.addEventListener("pointerup", e => {
  if (swipeY !== null && !swiped){
    const r = pad.getBoundingClientRect();
    laneQueue += (e.clientY - r.top) < r.height / 2 ? -1 : 1;
  }
  swipeX = swipeY = null; swiped = false;
}, { passive:true });
pad.addEventListener("pointercancel", () => { swipeX = swipeY = null; swiped = false; });

/* ---------- level ---------- */
function startLevel(i){
  cur = i;
  const L = LEVELS[i], C = COUNTRIES[L.country];
  W = {
    L, C,
    lane: 1, y: LANES[1], targetY: LANES[1],
    x: 86, targetX: 86,                       // position along the road
    speed: L.speed, anim: 0, dist: 0,
    food: 100, lives: 3, eaten: 0,
    cars: [], items: [], puffs: [],
    spawn: 0, itemSpawn: 0,
    hurt: 0, crash: 0, flash: 0,
    scroll: 0, done: false
  };
  mode = "play";
  laneQueue = 0; nudgeQueue = 0;
  hideAll();
  $("hint").textContent = TOUCH ? "" : "\u2191\u2193 lane   \u2190\u2192 weave";
}

function laneShift(d){
  if (!W || W.crash > 0) return;
  const n = Math.max(0, Math.min(LANES.length - 1, W.lane + d));
  if (n !== W.lane) { W.lane = n; W.targetY = LANES[n]; }
}

function nudge(d){
  if (!W || W.crash > 0) return;
  W.targetX = Math.max(NUDGE_MIN, Math.min(NUDGE_MAX, W.targetX + d * NUDGE_STEP));
}

function spawnCar(){
  const C = W.C;
  const key = C.traffic[(Math.random() * C.traffic.length) | 0];
  const lane = (Math.random() * LANES.length) | 0;
  // oncoming in the top two lanes, overtaking in the bottom two -- gives the
  // road a real direction instead of random drift
  const oncoming = lane < 2;
  const base = oncoming ? -(70 + Math.random() * 55) : (30 + Math.random() * 60);
  W.cars.push({
    key, lane, y: LANES[lane],
    x: oncoming ? VW + 60 : -110,
    vx: oncoming ? base - W.speed * 0.35 : base,
    oncoming
  });
}

function spawnItem(){
  const C = W.C;
  const d = C.dishes[(Math.random() * C.dishes.length) | 0];
  const lane = (Math.random() * LANES.length) | 0;
  W.items.push({ ...d, lane, y: LANES[lane], x: VW + 30, bob: Math.random() * 6 });
}

function hitCheck(){
  const px = W.x, pw = 22;
  for (const c of W.cars){
    if (c.lane !== W.lane) continue;
    const im = IMG[c.key];
    const cw = im && im.width ? im.width * 0.34 : 44;
    if (c.x < px + pw && c.x + cw > px - 6) return c;
  }
  return null;
}

function stepPlay(dt){
  const L = W.L, s = dt / 1000;

  while (laneQueue !== 0){
    const d = laneQueue > 0 ? 1 : -1;
    laneQueue -= d;
    laneShift(d);
  }
  while (nudgeQueue !== 0){
    const d = nudgeQueue > 0 ? 1 : -1;
    nudgeQueue -= d;
    nudge(d);
  }

  if (W.crash > 0){
    W.crash -= dt;
    W.speed += (55 - W.speed) * Math.min(1, s * 4);
    if (W.crash <= 0){ W.hurt = 1400; }
  } else {
    W.speed += (L.speed - W.speed) * Math.min(1, s * 1.8);
    W.y += (W.targetY - W.y) * Math.min(1, s * 12);
    W.x += (W.targetX - W.x) * Math.min(1, s * 9);
  }
  if (W.hurt > 0) W.hurt -= dt;
  if (W.flash > 0) W.flash -= dt;

  W.anim += dt * (W.speed / 120);
  W.dist += W.speed * s * 0.42;
  W.scroll += W.speed * s;

  // hunger: the whole reason to collect anything
  W.food -= L.drain * s;
  if (W.food <= 0){ W.food = 0; return end(false, "empty"); }

  // traffic
  W.spawn -= dt;
  if (W.spawn <= 0){
    spawnCar();
    W.spawn = (620 / L.density) * (0.55 + Math.random() * 0.9);
  }
  const drift = W.speed * s;
  for (let i = W.cars.length - 1; i >= 0; i--){
    const c = W.cars[i];
    c.x += (c.vx * s) - (c.oncoming ? 0 : drift * 0.55);
    if (c.oncoming) c.x -= drift * 0.5;
    if (c.x < -220 || c.x > VW + 260) W.cars.splice(i, 1);
  }

  // food
  W.itemSpawn -= dt;
  if (W.itemSpawn <= 0){
    spawnItem();
    W.itemSpawn = 1500 + Math.random() * 1400;
  }
  for (let i = W.items.length - 1; i >= 0; i--){
    const it = W.items[i];
    it.x -= drift * 1.0;
    it.bob += s * 4;
    if (it.lane === W.lane && Math.abs(it.x - (W.x + 6)) < 26 && W.crash <= 0){
      W.food = Math.min(100, W.food + it.fill);
      W.eaten++;
      W.flash = 260;
      W.puffs.push({ x: it.x, y: it.y - 30, t: 900, name: it.name });
      W.items.splice(i, 1); continue;
    }
    if (it.x < -60) W.items.splice(i, 1);
  }

  for (let i = W.puffs.length - 1; i >= 0; i--){
    W.puffs[i].t -= dt;
    W.puffs[i].y -= s * 26;
    if (W.puffs[i].t <= 0) W.puffs.splice(i, 1);
  }

  // collisions
  if (W.crash <= 0 && W.hurt <= 0){
    const hit = hitCheck();
    if (hit){
      W.lives--;
      W.crash = 900;
      W.food = Math.max(0, W.food - 12);
      W.cars = W.cars.filter(c => c !== hit);
      if (W.lives <= 0) return end(false, "crash");
    }
  }

  if (W.dist >= L.dist) return end(true);
}

function end(won, why){
  if (W.done) return;
  W.done = true;
  if (won){
    mode = "clear";
    const L = W.L, C = W.C;
    const last = cur === LEVELS.length - 1;
    totalEaten += W.eaten;
    saveProgress();
    if (cur === unlocked && !last){ unlocked = cur + 1; saveProgress(); }
    $("cTitle").textContent = last ? "Hanoi." : "You made it in.";
    $("cText").textContent = last
      ? `Three countries, nine rides, ${totalEaten} meals. Somebody buy this girl a beer.`
      : `${Math.round(L.dist)} m through ${C.name}. ${W.eaten} meal${W.eaten === 1 ? "" : "s"} `
        + `on this leg \u2014 ${totalEaten} so far on the trip.`;
    $("btnNext").textContent = last ? "Ride it again" : "Onward";
    show("scClear");
  } else {
    mode = "over";
    $("oTitle").textContent = why === "empty" ? "Running on empty." : "That's the bike.";
    $("oText").textContent = why === "empty"
      ? "You ran out of road food before the next town. Eat more, brake less."
      : "Three spills is enough for one day. The bike needs a mechanic and you need a lie down.";
    show("scOver");
  }
}

/* ---------- drawing ---------- */
/* ---------- background ----------
   One painted scene per country, drawn as two strips so the scenery drifts
   slower than the road. Each strip is pre-blended at build time so its right
   edge fades into its left, which means plain tiling loops with no seam --
   mirroring would loop cleanly too, but it puts an obvious butterfly
   symmetry on screen whenever the strip is narrower than the viewport. */
function drawStrip(key, y, h, off){
  const im = IMG[key];
  if (!im || !im.width) return;
  const w = im.width;
  let x = -(off % w);
  if (x > 0) x -= w;
  for (; x < VW; x += w) ctx.drawImage(im, x, y, w, h);
}

function background(C, off){
  drawStrip(`bg_${C.bg}_sky`,  0,     SPLIT,      off * 0.18);
  drawStrip(`bg_${C.bg}_road`, SPLIT, VH - SPLIT, off * 1.0);
}

function drawSprite(key, cx, footY, h, flip){
  const im = IMG[key];
  if (!im || !im.width) return;
  const w = im.width * (h / im.height);
  ctx.save();
  ctx.translate(cx, footY);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, -h, w, h);
  ctx.restore();
}

function rideKey(){
  // only two riding poses exist in the source art, so this is a 2-frame
  // pedal cycle rather than a 4-frame one
  if (W.crash > 0) return "wipeout";
  const f = Math.floor(W.anim / 160) % 2;
  return ["ride0","ride1"][f];
}

function hud(){
  // food meter
  const x = 10, y = 10, w = 128, h = 11;
  ctx.fillStyle = "rgba(12,15,22,.72)"; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  const pct = W.food / 100;
  ctx.fillStyle = pct > .5 ? "#7FC96B" : pct > .25 ? "#F2B441" : "#D9553F";
  ctx.fillRect(x, y, w * pct, h);
  ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  ctx.fillStyle = "#F5EFE3"; ctx.font = "700 9px Chivo, sans-serif";
  ctx.fillText("FOOD", x + 2, y + h + 12);

  // lives
  for (let i = 0; i < W.lives; i++){
    ctx.fillStyle = "#D9553F";
    ctx.fillRect(VW - 14 - i * 12, 10, 9, 9);
  }
  // progress
  const p = Math.min(1, W.dist / W.L.dist);
  ctx.fillStyle = "rgba(12,15,22,.72)"; ctx.fillRect(VW - 132, 28, 124, 7);
  ctx.fillStyle = "#F2B441"; ctx.fillRect(VW - 130, 30, 120 * p, 3);
  ctx.fillStyle = "#F5EFE3"; ctx.font = "700 9px Chivo, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(`${W.C.name.toUpperCase()}  ${W.L.idx + 1}/3`, VW - 8, 48);
  ctx.fillStyle = "#F2B441";
  ctx.fillText(`${totalEaten + W.eaten} meals`, VW - 8, 60);
  ctx.textAlign = "left";
}

function drawPlay(){
  const C = W.C;
  background(C, W.scroll);

  // everything on the road, painted back to front so nearer lanes overlap
  const things = [];
  W.items.forEach(it => things.push({ y: it.y, kind: "item", o: it }));
  W.cars.forEach(c  => things.push({ y: c.y,  kind: "car",  o: c }));
  things.push({ y: W.y, kind: "me" });
  things.sort((a, b) => a.y - b.y);

  for (const t of things){
    if (t.kind === "car"){
      drawSprite(t.o.key, t.o.x, t.o.y + 10, 40, t.o.oncoming);
    } else if (t.kind === "item"){
      const bob = Math.sin(t.o.bob) * 3;
      drawSprite(t.o.key, t.o.x, t.o.y + 4 + bob, 24, false);
    } else {
      const blink = W.hurt > 0 && Math.floor(W.hurt / 90) % 2 === 0;
      if (!blink){
        if (W.crash > 0) drawSprite("wipeout", W.x, W.y + 12, 36, false);
        else drawSprite(rideKey(), W.x, W.y + 11, 44, false);
      }
    }
  }

  W.puffs.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.t / 700));
    ctx.fillStyle = "#F5EFE3"; ctx.font = "700 10px Chivo, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.name, p.x, p.y);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  });

  if (W.flash > 0){
    ctx.fillStyle = `rgba(242,180,65,${(W.flash / 260) * .18})`;
    ctx.fillRect(0, 0, VW, VH);
  }
  hud();
}

/* ---------- the map ----------
   Nine stops strung across three countries, walked between like a world map.
   Positions are hand-placed so the route reads as a journey north. */
const NODES = [
  { x: 80.3,  y: 203.2 }, { x: 128.8, y: 173.1 }, { x: 171.5, y: 188.3 },
  { x: 228.6, y: 153.2 }, { x: 270.9, y: 123.9 }, { x: 312.5, y: 139.9 },
  { x: 363.9, y: 111.6 }, { x: 408.7, y: 181.5 }, { x: 455.8, y: 225.9 }
];
const NODE_R = 15;   // painted circle radius, for lock overlays and taps

function drawMap(){
  drawStrip("bg_map", 0, VH, 0);   // static -- no scroll offset

  // the painting already has the route, the labels and the circles; the
  // only things that need to change with game state are what's locked and
  // where the rider currently stands
  NODES.forEach((n, i) => {
    if (i > unlocked){
      ctx.fillStyle = "rgba(10,13,20,.62)";
      ctx.beginPath(); ctx.arc(n.x, n.y, NODE_R, 0, 7); ctx.fill();
    } else if (i === cur){
      ctx.strokeStyle = "#F2B441"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, NODE_R + 3, 0, 7); ctx.stroke();
    }
  });

  // the rider, walking between stops
  const a = NODES[mapWalk.at], b = NODES[mapWalk.to];
  const t = mapWalk.t;
  const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
  if (t < 1){
    const f = Math.floor(performance.now() / 130) % 3;
    drawSprite(["walk0","walk1","walk2"][f], x, y - 4, 30, b.x < a.x);
  } else {
    drawSprite("map_girl", x, y - 4, 30, false);
  }

  ctx.save();
  ctx.fillStyle = "rgba(11,14,20,.55)"; ctx.fillRect(0, VH - 34, VW, 34);
  ctx.fillStyle = "#F5EFE3"; ctx.font = "900 13px Chivo, sans-serif";
  ctx.textAlign = "center";
  const L = LEVELS[cur];
  ctx.fillText(`${COUNTRIES[L.country].name}  \u2014  stop ${L.idx + 1}`, VW / 2, VH - 18);
  ctx.font = "400 9px Chivo, sans-serif"; ctx.fillStyle = "#C8C0AF";
  ctx.fillText(TOUCH ? "tap a stop to ride" : "\u2190 \u2192 choose a stop, Enter to ride", VW / 2, VH - 6);
  ctx.textAlign = "left";
  ctx.restore();
}

function toMap(){
  mode = "map";
  mapWalk = { at: cur, to: cur, t: 1 };
  hideAll();
  $("hint").textContent = "";
}

function mapMove(d){
  const n = Math.max(0, Math.min(unlocked, cur + d));
  if (n === cur) return;
  mapWalk = { at: cur, to: n, t: 0 };
  cur = n;
}

/* ---------- brief ---------- */
function showBrief(){
  const L = LEVELS[cur], C = COUNTRIES[L.country];
  $("bFlag").textContent = C.flag;
  $("bTitle").textContent = `Stop ${L.idx + 1} of 3`;
  $("bText").textContent = C.blurb;
  $("bDish").innerHTML = C.dishes.map(d => `<span>${d.name}</span>`).join("");
  show("scBrief");
}

/* ---------- screens ---------- */
const SCREENS = ["scTitle","scBrief","scClear","scOver"];
function hideAll(){ SCREENS.forEach(s => $(s).classList.add("hide")); }
function show(id){ hideAll(); $(id).classList.remove("hide"); }

$("btnStart").onclick = () => { toMap(); };
$("btnGo").onclick    = () => { startLevel(cur); };
$("btnNext").onclick  = () => {
  if (cur < LEVELS.length - 1 && cur < unlocked) cur = Math.min(unlocked, cur + 1);
  toMap();
};
$("btnRetry").onclick = () => { startLevel(cur); };
$("btnQuit").onclick  = () => { toMap(); };

addEventListener("keydown", e => {
  if (mode !== "map") return;
  if (e.key === "ArrowLeft"  || e.key.toLowerCase() === "a") mapMove(-1);
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") mapMove(1);
  if (e.key === "Enter" || e.key === " ") showBrief();
});
cvs.addEventListener("pointerdown", e => {
  if (mode !== "map") return;
  const r = cvs.getBoundingClientRect();
  const mx = (e.clientX - r.left - offX) / scale;
  const my = (e.clientY - r.top - offY) / scale;
  let best = -1, bd = NODE_R + 8;
  NODES.forEach((n, i) => {
    if (i > unlocked) return;
    const d = Math.hypot(n.x - mx, n.y - my);
    if (d < bd){ bd = d; best = i; }
  });
  if (best >= 0){
    if (best === cur) showBrief();
    else { mapWalk = { at: cur, to: best, t: 0 }; cur = best; }
  }
});

/* ---------- loop ---------- */
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(48, now - last || 16);
  last = now;

  if (TOUCH) pad.classList.toggle("on", mode === "play");
  if (mode === "play" && W) stepPlay(dt);
  if (mode === "map" && mapWalk.t < 1){
    mapWalk.t = Math.min(1, mapWalk.t + dt / 480);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0B0E14";
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();

  if (mode === "play" && W) drawPlay();
  else if (mode === "map") drawMap();
  else if (W && (mode === "clear" || mode === "over")) drawPlay();
  else {
    const C = COUNTRIES[2];
    background(C, performance.now() * .05);
    drawSprite("ride1", 120, LANES[1] + 12, 44, false);
  }
}

fit();
checkOrientation();
loadArt(() => { requestAnimationFrame(frame); });
</script>
</body>
</html>
